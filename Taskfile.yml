version: '3'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: Validate the plan and ess/, explore the example protocol models, check the time profile and the generated docs, then format, lint and test.
    cmds:
      - task: plan
      - task: spec
      - task: examples
      - task: time
      - task: docs-check
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  spec:
    desc: Validate RFCspec's own ESS specification.
    cmds:
      - ess specify validate --path ess

  examples:
    desc: Fail unless bounded exploration of every example protocol model passes.
    cmds:
      - cmd: >-
          ess protocol explore --path examples/websocket/close.protospec.yaml
          --inputs examples/websocket/close.inputs.json | grep -q '"verdict": "passed"'

  time:
    desc: Check the time profile's overlay, its lowered models and their exploration, and its generated codec and tests.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- check --profile profiles/time
      - cargo run -q --locked -p rfcspec-cli -- lower --profile profiles/time --check
      - cmd: >-
          ess protocol explore --path profiles/time/generated/tcp.protospec.yaml
          --inputs profiles/time/witnesses/tcp.inputs.json | grep -q '"verdict": "passed"'
      - cmd: >-
          ess protocol explore --path profiles/time/generated/udp.protospec.yaml
          --inputs profiles/time/witnesses/udp.inputs.json | grep -q '"verdict": "passed"'
      - cargo run -q --locked -p rfcspec-cli -- generate --check
      - cargo test -q --locked -p rfc868-time

  docs-generate:
    desc: Rewrite the generated pages under website/docs/.
    cmds:
      - cargo run -q --locked -p rfcspec-docs -- generate

  docs-check:
    desc: Fail when a generated page is missing, stale or edited by hand.
    cmds:
      - cargo run -q --locked -p rfcspec-docs -- generate --check

  website:
    desc: Install the site's locked dependencies and build it, as the Pages workflow does.
    dir: website
    cmds:
      - npm ci --allow-git=root
      - npm run build
