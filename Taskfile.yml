version: '3'

vars:
  TYPES: --path . --root rfcspec.catalogue.ExplorerShard --names short --declared-field-order
  RUST_TYPES: --target rust --package rfcspec-explorer-types --rust-box-only-recursion

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: Validate the plan and ess/, explore the example protocol models, check the time profile and the generated docs, then format, lint and test.
    cmds:
      - task: plan
      - task: spec
      - task: types-check
      - task: examples
      - task: time
      - task: websocket
      - task: dns
      - task: ntp
      - task: bulk
      - task: docs-check
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate

  spec:
    desc: Validate RFCspec's own ESS specification.
    cmds:
      - ess specify validate --path ess

  examples:
    desc: Fail unless bounded exploration of every example protocol model passes.
    cmds:
      - cmd: >-
          ess protocol explore --path examples/websocket/close.protospec.yaml
          --inputs examples/websocket/close.inputs.json | grep -q '"verdict": "passed"'

  time:
    desc: Check the time profile's overlay, its lowered models and their exploration, and its generated codec and tests.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- check --all profiles
      - cargo run -q --locked -p rfcspec-cli -- lower --profile profiles/time --check
      - cmd: >-
          ess protocol explore --path profiles/time/generated/tcp.protospec.yaml
          --inputs profiles/time/witnesses/tcp.inputs.json | grep -q '"verdict": "passed"'
      - cmd: >-
          ess protocol explore --path profiles/time/generated/udp.protospec.yaml
          --inputs profiles/time/witnesses/udp.inputs.json | grep -q '"verdict": "passed"'
      - cargo run -q --locked -p rfcspec-cli -- generate --check
      - cargo test -q --locked -p rfc868-time

  websocket:
    desc: Replay the websocket profile's recorded proposals offline, check its lowered closing, ping and fragments models and their exploration, and its generated frame codec and tests.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- propose --profile profiles/websocket --replay
      - cargo run -q --locked -p rfcspec-cli -- lower --profile profiles/websocket --check
      - cmd: >-
          ess protocol explore --path profiles/websocket/generated/close.protospec.yaml
          --inputs profiles/websocket/witnesses/close.inputs.json | grep -q '"verdict": "passed"'
      - cmd: >-
          ess protocol explore --path profiles/websocket/generated/ping.protospec.yaml
          --inputs profiles/websocket/witnesses/ping.inputs.json | grep -q '"verdict": "passed"'
      - cmd: >-
          ess protocol explore --path profiles/websocket/generated/fragments.protospec.yaml
          --inputs profiles/websocket/witnesses/fragments.inputs.json | grep -q '"verdict": "passed"'
      - cargo run -q --locked -p rfcspec-cli -- generate --profile profiles/websocket --check
      - cargo test -q --locked -p rfc6455-websocket

  dns:
    desc: Check the dns profile's lowered query model and its exploration, and its generated header codec and tests.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- lower --profile profiles/dns --check
      - cmd: >-
          ess protocol explore --path profiles/dns/generated/query.protospec.yaml
          --inputs profiles/dns/witnesses/query.inputs.json | grep -q '"verdict": "passed"'
      - cargo run -q --locked -p rfcspec-cli -- generate --profile profiles/dns --check
      - cargo test -q --locked -p rfc1035-dns

  ntp:
    desc: Check the ntp profile's lowered exchange and poll models and their exploration, and its generated header codec and tests.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- lower --profile profiles/ntp --check
      - cmd: >-
          ess protocol explore --path profiles/ntp/generated/exchange.protospec.yaml
          --inputs profiles/ntp/witnesses/exchange.inputs.json | grep -q '"verdict": "passed"'
      - cmd: >-
          ess protocol explore --path profiles/ntp/generated/poll.protospec.yaml
          --inputs profiles/ntp/witnesses/poll.inputs.json | grep -q '"verdict": "passed"'
      - cargo run -q --locked -p rfcspec-cli -- generate --profile profiles/ntp --check
      - cargo test -q --locked -p rfc5905-ntp

  bulk:
    desc: Check the committed bulk summary and its section sidecar offline against themselves and against the RFCs the profiles lock.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- bulk check --summary bulk/rfc-summary.jsonl --profiles profiles --sections bulk/rfc-sections.jsonl

  bulk-regenerate:
    desc: Fetch rfc-index.xml, the RFCXML of every RFC the index lists as XML and the plain text of every other RFC it lists as TXT into the cache outside the repository (CACHE, else the default cache), then rewrite bulk/rfc-summary.jsonl and its section sidecar bulk/rfc-sections.jsonl from it. Networked; check never runs it.
    cmds:
      - cargo run -q --locked -p rfcspec-cli -- bulk fetch {{if .CACHE}}--cache {{.CACHE}}{{end}}
      - cargo run -q --locked -p rfcspec-cli -- bulk summarise {{if .CACHE}}--cache {{.CACHE}}{{end}} --out bulk/rfc-summary.jsonl --sections bulk/rfc-sections.jsonl

  docs-generate:
    desc: Rewrite the generated pages under website/docs/.
    cmds:
      - cargo run -q --locked -p rfcspec-docs -- generate

  docs-check:
    desc: Fail when a generated page is missing, stale or edited by hand.
    cmds:
      - cargo run -q --locked -p rfcspec-docs -- generate --check

  types-generate:
    desc: Rewrite the RFC explorer's types that ess/domains/catalogue.yaml determines, the Rust crate the shard writer uses and the TypeScript declarations the app reads.
    cmds:
      - rm -rf generated/rust/rfcspec-explorer-types explorer/src/generated
      - cd ess && ess generate types {{.TYPES}} {{.RUST_TYPES}} --out ../generated/rust/rfcspec-explorer-types
      - cd ess && ess generate types {{.TYPES}} --target typescript --out ../explorer/src/generated

  types-check:
    desc: Fail when the generated Rust or TypeScript explorer types differ from what ess/domains/catalogue.yaml determines.
    cmds:
      - rm -rf target/types-drift
      - cd ess && ess generate types {{.TYPES}} {{.RUST_TYPES}} --out ../target/types-drift/rust
      - cd ess && ess generate types {{.TYPES}} --target typescript --out ../target/types-drift/ts
      - diff -r --exclude=.ess-output target/types-drift/rust generated/rust/rfcspec-explorer-types
      - diff -r --exclude=.ess-output target/types-drift/ts explorer/src/generated

  explorer:
    desc: Install the RFC explorer app's locked dependencies, type-check it with vue-tsc, test it with vitest and build it with vite into website/static/explorer.
    dir: explorer
    cmds:
      - pnpm install --frozen-lockfile
      - pnpm typecheck
      - pnpm test
      - pnpm build

  website:
    desc: Build the RFC explorer, then install the site's locked dependencies and build it, as the Pages workflow does.
    cmds:
      - task: explorer
      - task: docusaurus

  docusaurus:
    desc: Install the site's locked dependencies and run the Docusaurus build alone; `website` builds the explorer first.
    dir: website
    cmds:
      - npm ci --allow-git=root
      - npm run build
