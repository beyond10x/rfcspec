domain: rfcspec.profile

summary: >-
  A profile names a set of RFCs and the parts of each in scope, declares the communication
  semantics of its protocol, holds the machines extracted for it, and keeps one requirement
  status per requirement. Requirement statuses are per profile.

naming:
  wire: profiles
  display: Profiles

types:
  - name: rfcspec.profile.ProfileName
    kind: newtype
    of: String
    naming:
      summary: The name of a profile, such as websocket.

  - name: rfcspec.profile.ProfileRfc
    kind: struct
    naming:
      summary: One RFC a profile includes and the sections of it in scope.
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: sections
        type: List<rfcspec.catalogue.ItemId>
        summary: Empty means the whole RFC; a non-empty list narrows the scope to those sections.

  - name: rfcspec.profile.Endpoint
    kind: enum
    variants:
      - name: Exchange
        wire: exchange
      - name: Stream
        wire: stream

  - name: rfcspec.profile.Layering
    kind: struct
    naming:
      summary: The lower layer that supplies the channel, written over <profile>.<exchange or stream>.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: endpoint
        type: rfcspec.profile.Endpoint
      - name: name
        type: String

  - name: rfcspec.profile.Unit
    kind: enum
    variants:
      - name: Bytes
        wire: bytes
        summary: A stream without message boundaries.
      - name: Messages
        wire: messages
        summary: Boundaries preserved.
      - name: Datagrams
        wire: datagrams
        summary: Bounded, independent.

  - name: rfcspec.profile.Delivery
    kind: struct
    fields:
      - name: ordered
        type: Boolean
      - name: reliable
        type: Boolean
      - name: duplicates
        type: Boolean
        summary: Duplicates are possible.

  - name: rfcspec.profile.Direction
    kind: enum
    variants:
      - name: Simplex
        wire: simplex
      - name: HalfDuplex
        wire: half-duplex
        summary: One side speaks at a time, with a turn rule.
      - name: FullDuplex
        wire: full-duplex

  - name: rfcspec.profile.Multiplexing
    kind: enum
    variants:
      - name: Single
        wire: single
      - name: Streams
        wire: streams
        summary: Ids, opened by either side, independently ordered.
      - name: Sessions
        wire: sessions
        summary: Many conversations over one association.

  - name: rfcspec.profile.Exchange
    kind: enum
    variants:
      - name: RequestResponse
        wire: request-response
      - name: RequestStream
        wire: request-stream
      - name: Session
        wire: session
        summary: Long-lived, both sides send.
      - name: Publish
        wire: publish
      - name: OneShot
        wire: one-shot

  - name: rfcspec.profile.Correlation
    kind: enum
    variants:
      - name: None
        wire: none
      - name: ByOrder
        wire: by-order
      - name: ById
        wire: by-id

  - name: rfcspec.profile.Lifetime
    kind: enum
    variants:
      - name: Connectionless
        wire: connectionless
      - name: Connection
        wire: connection
        summary: Open, established, closing, closed.
      - name: Association
        wire: association
        summary: An association with timers.

  - name: rfcspec.profile.Layer
    kind: enum
    naming:
      summary: The layers of the stack a profile declares semantics for.
    variants:
      - name: Transport
        wire: transport
      - name: Stream
        wire: stream
      - name: Connection
        wire: connection
      - name: Protocol
        wire: protocol
      - name: Exchange
        wire: exchange
      - name: Application
        wire: application

  - name: rfcspec.profile.LayerSemantics
    kind: struct
    naming:
      summary: >-
        One value per axis for one layer (design section 6.1), proposed in S3 with cited
        sentences and accepted by a reviewer.
    fields:
      - name: layer
        type: rfcspec.profile.Layer
      - name: unit
        type: rfcspec.profile.Unit
      - name: delivery
        type: rfcspec.profile.Delivery
      - name: direction
        type: rfcspec.profile.Direction
      - name: multiplexing
        type: rfcspec.profile.Multiplexing
      - name: exchange
        type: rfcspec.profile.Exchange
      - name: correlation
        type: rfcspec.profile.Correlation
      - name: lifetime
        type: rfcspec.profile.Lifetime
      - name: over
        type: Optional<rfcspec.profile.Layering>
      - name: roles
        type: List<rfcspec.catalogue.PartyName>

  - name: rfcspec.profile.TransitionLink
    kind: struct
    naming:
      summary: The requirement ids one transition of the lowered protospec document names.
    fields:
      - name: transition
        type: String
      - name: requirements
        type: List<rfcspec.catalogue.ItemId>

  - name: rfcspec.profile.StatusKind
    kind: enum
    variants:
      - name: Satisfied
        wire: satisfied
        summary: Satisfied by a named model element.
      - name: Unsupported
        wire: unsupported
        summary: Not supported, with a reason, such as an ESS gap id.
      - name: NotApplicable
        wire: not-applicable
        summary: Not applicable, with a reason.

  - name: rfcspec.profile.MachineKey
    kind: struct
    naming:
      summary: A machine's identity, unique per profile and slug.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: slug
        type: String

  - name: rfcspec.profile.StatusKey
    kind: struct
    naming:
      summary: A status's identity, so one profile holds at most one status per requirement.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: requirement
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.profile.Evidence
    kind: struct
    naming:
      summary: A piece of test evidence for a status, a test name or report path and the SHA-256 of what it names.
    fields:
      - name: reference
        type: String
        summary: A test name or a report path.
      - name: digest
        type: rfcspec.catalogue.Digest

entities:
  - name: rfcspec.profile.Profile
    naming:
      summary: >-
        A named set of RFCs and the parts of each in scope, authored beside its overlay. Its
        semantics are replaced only by a reviewer under a Current decision.
    identity:
      name: profile
      type: rfcspec.profile.ProfileName
    fields:
      - name: rfcs
        type: List<rfcspec.profile.ProfileRfc>
      - name: parties
        type: List<rfcspec.catalogue.PartyName>
        summary: >-
          The parties in scope: a subset of the roles the profile's layer semantics declare. A
          party no layer declares as a role is refused when the profile is declared or revised.
      - name: semantics
        type: List<rfcspec.profile.LayerSemantics>
        summary: One entry per layer; a layer named twice is refused.
    invariants:
      - distinct: {in: semantics, as: s, by: s.layer}
    relations:
      - name: machines
        kind: owns
        target: rfcspec.profile.Machine
        cardinality: many
        via: profile
      - name: statuses
        kind: owns
        target: rfcspec.profile.Status
        cardinality: many
        via: profile
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  - name: rfcspec.profile.Machine
    naming:
      summary: >-
        A protocol machine of the profile. Its lowered ess-protospec/1 document is the authority
        for participants, states, triggers, effects and timers; the catalogue holds the document's
        path and digest, the requirement ids each transition names and the MUST-level requirements
        no transition names, and duplicates nothing else.
    identity:
      name: key
      type: rfcspec.profile.MachineKey
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
        summary: The key's profile.
      - name: name
        type: String
      - name: protospec_path
        type: String
        summary: Path of the lowered ess-protospec/1 document.
      - name: protospec_digest
        type: rfcspec.catalogue.Digest
        summary: SHA-256 of that document.
      - name: transitions
        type: List<rfcspec.profile.TransitionLink>
        summary: A transition may name no requirement; the lowering then lists the MUSTs left unlinked.
      - name: unlinked_musts
        type: List<rfcspec.catalogue.ItemId>
        summary: The MUST-level requirements in scope that no transition names, flagged by the lowering.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

  - name: rfcspec.profile.Status
    naming:
      summary: >-
        The status of one requirement in one profile, at most one per profile and requirement. A
        MUST-level requirement in scope needs one; that rule spans every requirement of a profile
        and is checked by rfcspec check, not here.
    identity:
      name: key
      type: rfcspec.profile.StatusKey
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
        summary: The key's profile.
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
        summary: The key's requirement.
      - name: kind
        type: rfcspec.profile.StatusKind
      - name: element
        type: Optional<String>
        summary: The model element a satisfied requirement is satisfied by.
      - name: reason
        type: Optional<String>
        summary: Why the requirement is unsupported or not applicable.
      - name: evidence
        type: Optional<List<rfcspec.profile.Evidence>>
        summary: The tests or reports the conformance matrix reads for this status.
    invariants:
      - any: [kind == Satisfied, defined(reason)]
      - any: [kind != Satisfied, defined(element)]
    relations:
      - name: requirement
        kind: references
        target: rfcspec.catalogue.Requirement
        cardinality: one
        via: requirement_id
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]

actors:
  - name: rfcspec.profile.Author
    naming:
      display: Author
      summary: Writes a profile, one of the two authored files per profile.
    may:
      - rfcspec.profile.DeclareProfile

  - name: rfcspec.profile.Lowering
    naming:
      display: Lowering
      summary: >-
        Stage S5, which records the lowered machines and marks a requirement unsupported with an
        ESS gap id where ESS cannot carry its rule, or not applicable.
    may:
      - rfcspec.profile.RecordMachine
      - rfcspec.profile.RecordStatus

  - name: rfcspec.profile.Verification
    naming:
      display: Verification
      summary: Stage S7, the only stage that records a requirement satisfied, with the tests that show it.
    may:
      - rfcspec.profile.RecordSatisfiedStatus

errors:
  - name: rfcspec.profile.PartyNotARole
    summary: A party in scope is not among the roles the profile's layer semantics declare.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName

  - name: rfcspec.profile.DuplicateLayer
    summary: The semantics name one layer twice, and nothing changed.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName

  - name: rfcspec.profile.ProfileNotFound
    summary: No profile has this name.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName

  - name: rfcspec.profile.StatusReasonMissing
    summary: An unsupported or not-applicable status names no reason.
    fields:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.profile.EvidenceMissing
    summary: A satisfied status names no test evidence.
    fields:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.profile.SatisfiedNotPermitted
    summary: Only the verification stage records a requirement satisfied.
    fields:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.profile.AlreadyExists
    summary: A record with this identity already exists in the profile, and nothing was recorded.
    fields: []

commands:
  - name: rfcspec.profile.DeclareProfile
    naming:
      wire: declare-profile
      display: Declare a profile
    input:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: rfcs
        type: List<rfcspec.profile.ProfileRfc>
      - name: parties
        type: List<rfcspec.catalogue.PartyName>
      - name: semantics
        type: List<rfcspec.profile.LayerSemantics>
    outcomes:
      - name: duplicate-layer
        when: {not: {distinct: {in: semantics, as: s, by: s.layer}}}
        error: rfcspec.profile.DuplicateLayer
        payload:
          rfcspec.profile.DuplicateLayer:
            profile: input.profile
        summary: A layer is named twice, and nothing was declared.
      - name: party-not-a-role
        when:
          not:
            forall:
              in: parties
              as: p
              that:
                exists:
                  in: semantics
                  as: s
                  that:
                    exists: {in: s.roles, as: r, that: r == p}
        error: rfcspec.profile.PartyNotARole
        payload:
          rfcspec.profile.PartyNotARole:
            profile: input.profile
        summary: A party in scope is a role of no layer, and nothing was declared.
      - name: already-exists
        existing_instance: true
        error: rfcspec.profile.AlreadyExists
        summary: A profile with this name is already declared, and nothing was recorded.
      - name: declared
        creates: rfcspec.profile.Profile
        instance: profile
        emits:
          - rfcspec.profile.ProfileDeclared
        payload:
          rfcspec.profile.ProfileDeclared:
            profile: input.profile
        sets:
          rfcs: input.rfcs
          parties: input.parties
          semantics: input.semantics
        summary: The profile exists. Fetch lists updated-by RFCs as candidates and never adds them to it.

  - name: rfcspec.profile.ReviseProfile
    naming:
      wire: revise-profile
      display: Revise a profile's semantics
      summary: >-
        A reviewer replaces the profile's semantics block with the semantics accepted from S3
        proposals, under a Current decision of the profile's overlay.
    input:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: semantics
        type: List<rfcspec.profile.LayerSemantics>
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: duplicate-layer
        when: {not: {distinct: {in: semantics, as: s, by: s.layer}}}
        error: rfcspec.profile.DuplicateLayer
        payload:
          rfcspec.profile.DuplicateLayer:
            profile: input.profile
        summary: A layer is named twice, and the profile is unchanged.
      - name: party-not-a-role
        when_subject:
          predicate:
            not:
              forall:
                in: parties
                as: p
                that:
                  exists:
                    in: input.semantics
                    as: s
                    that:
                      exists: {in: s.roles, as: r, that: r == p}
        error: rfcspec.profile.PartyNotARole
        payload:
          rfcspec.profile.PartyNotARole:
            profile: input.profile
        summary: A party in scope would be a role of no layer, and the profile is unchanged.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the profile is unchanged.
      - name: other-profile
        when_related: {via: input.decision, predicate: profile != input.profile}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is in another profile's overlay, and the profile is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the profile is unchanged.
      - name: revised
        updates: rfcspec.profile.Profile
        instance: profile
        emits:
          - rfcspec.profile.ProfileRevised
        payload:
          rfcspec.profile.ProfileRevised:
            profile: input.profile
        sets:
          semantics: input.semantics
        summary: The profile's semantics are replaced.
      - name: unknown
        unknown_instance: true
        error: rfcspec.profile.ProfileNotFound
        payload:
          rfcspec.profile.ProfileNotFound:
            profile: input.profile
        summary: No profile has this name.

  - name: rfcspec.profile.RecordMachine
    naming:
      wire: record-machine
      display: Record a machine
    input:
      - name: key
        type: rfcspec.profile.MachineKey
      - name: name
        type: String
      - name: protospec_path
        type: String
      - name: protospec_digest
        type: rfcspec.catalogue.Digest
      - name: transitions
        type: List<rfcspec.profile.TransitionLink>
      - name: unlinked_musts
        type: List<rfcspec.catalogue.ItemId>
    outcomes:
      - name: already-exists
        existing_instance: true
        error: rfcspec.profile.AlreadyExists
        summary: The profile already holds a machine with this slug, and nothing was recorded.
      - name: recorded
        creates: rfcspec.profile.Machine
        instance: key
        emits:
          - rfcspec.profile.MachineRecorded
        payload:
          rfcspec.profile.MachineRecorded:
            key: input.key
        sets:
          profile: input.key.profile
          name: input.name
          protospec_path: input.protospec_path
          protospec_digest: input.protospec_digest
          transitions: input.transitions
          unlinked_musts: input.unlinked_musts
        summary: The machine is part of the profile.

  - name: rfcspec.profile.RecordStatus
    naming:
      wire: record-status
      display: Record a requirement unsupported or not applicable
      summary: >-
        Lowering or a reviewer records a requirement unsupported or not applicable, with a reason,
        under a Current decision of the profile's overlay on that requirement.
    input:
      - name: key
        type: rfcspec.profile.StatusKey
      - name: kind
        type: rfcspec.profile.StatusKind
        example: Unsupported
      - name: reason
        type: Optional<String>
      - name: evidence
        type: Optional<List<rfcspec.profile.Evidence>>
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: satisfied-not-permitted
        when: kind == Satisfied
        error: rfcspec.profile.SatisfiedNotPermitted
        payload:
          rfcspec.profile.SatisfiedNotPermitted:
            requirement_id: input.key.requirement
        summary: A satisfied status is recorded only by verification, and nothing was recorded.
      - name: incomplete
        when: not defined(reason)
        error: rfcspec.profile.StatusReasonMissing
        payload:
          rfcspec.profile.StatusReasonMissing:
            requirement_id: input.key.requirement
        summary: The status names no reason, and nothing was recorded.
      - name: already-exists
        existing_instance: true
        error: rfcspec.profile.AlreadyExists
        summary: The requirement already has a status in the profile, and nothing was recorded.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and nothing was recorded.
      - name: other-item
        when_related:
          via: input.decision
          predicate:
            any:
              - profile != input.key.profile
              - item != input.key.requirement
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another profile or requirement, and nothing was recorded.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and nothing was recorded.
      - name: recorded
        creates: rfcspec.profile.Status
        instance: key
        emits:
          - rfcspec.profile.StatusRecorded
        payload:
          rfcspec.profile.StatusRecorded:
            key: input.key
            kind: input.kind
        sets:
          profile: input.key.profile
          requirement_id: input.key.requirement
          kind: input.kind
          reason: input.reason
          evidence: input.evidence
        summary: The requirement has this status in the profile.

  - name: rfcspec.profile.RecordSatisfiedStatus
    naming:
      wire: record-satisfied-status
      display: Record a requirement satisfied
      summary: >-
        Verification records a requirement satisfied by a named model element, with the test
        evidence the conformance matrix reads. The evidence, not a review decision, is what
        admits it.
    input:
      - name: key
        type: rfcspec.profile.StatusKey
      - name: element
        type: String
      - name: evidence
        type: List<rfcspec.profile.Evidence>
    outcomes:
      - name: no-evidence
        when: evidence.count == 0
        error: rfcspec.profile.EvidenceMissing
        payload:
          rfcspec.profile.EvidenceMissing:
            requirement_id: input.key.requirement
        summary: A satisfied status names no test evidence, and nothing was recorded.
      - name: already-exists
        existing_instance: true
        error: rfcspec.profile.AlreadyExists
        summary: The requirement already has a status in the profile, and nothing was recorded.
      - name: recorded
        creates: rfcspec.profile.Status
        instance: key
        emits:
          - rfcspec.profile.StatusRecorded
        payload:
          rfcspec.profile.StatusRecorded:
            key: input.key
            kind: Satisfied
        sets:
          profile: input.key.profile
          requirement_id: input.key.requirement
          kind: Satisfied
          element: input.element
          evidence: input.evidence
        summary: The requirement is satisfied in the profile.

events:
  - name: rfcspec.profile.ProfileDeclared
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName

  - name: rfcspec.profile.ProfileRevised
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName

  - name: rfcspec.profile.MachineRecorded
    fields:
      - name: key
        type: rfcspec.profile.MachineKey

  - name: rfcspec.profile.StatusRecorded
    fields:
      - name: key
        type: rfcspec.profile.StatusKey
      - name: kind
        type: rfcspec.profile.StatusKind

views:
  - name: rfcspec.profile.Statuses
    source: rfcspec.profile.Status
    consistency: read_your_writes
    naming:
      wire: statuses
      display: Statuses
    fields:
      - name: key
        type: rfcspec.profile.StatusKey
      - name: state
        type: rfcspec.profile.Status.State
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
      - name: kind
        type: rfcspec.profile.StatusKind
      - name: element
        type: Optional<String>
      - name: reason
        type: Optional<String>
      - name: evidence
        type: Optional<List<rfcspec.profile.Evidence>>

  - name: rfcspec.profile.Profiles
    source: rfcspec.profile.Profile
    consistency: read_your_writes
    naming:
      wire: profiles
      display: Profiles
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: state
        type: rfcspec.profile.Profile.State
      - name: parties
        type: List<rfcspec.catalogue.PartyName>
      - name: semantics
        type: List<rfcspec.profile.LayerSemantics>

  - name: rfcspec.profile.Machines
    source: rfcspec.profile.Machine
    consistency: read_your_writes
    naming:
      wire: machines
      display: Machines
    fields:
      - name: key
        type: rfcspec.profile.MachineKey
      - name: state
        type: rfcspec.profile.Machine.State
      - name: name
        type: String
      - name: protospec_path
        type: String
      - name: protospec_digest
        type: rfcspec.catalogue.Digest
      - name: unlinked_musts
        type: List<rfcspec.catalogue.ItemId>
