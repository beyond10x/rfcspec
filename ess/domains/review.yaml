domain: rfcspec.review

summary: >-
  AI proposals and the review decisions over them. A proposal is a recorded, replayable typed
  document with cited spans and changes nothing until a decision is written to the profile's
  overlay. Decisions are keyed by the item's stable id and the digest of the text they judged, so
  re-import never loses them and a changed source text marks them stale. Verified errata enter
  the overlay as decisions of kind erratum.

naming:
  wire: review
  display: Review

types:
  - name: rfcspec.review.ProposalId
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
    naming:
      summary: >-
        The SHA-256 of the proposal's task, model id and input digest. Replay looks a recording
        up by this id, so the same inputs return the recorded response.

  - name: rfcspec.review.ModelId
    kind: newtype
    of: String
    naming:
      summary: The id of the model that produced a proposal.

  - name: rfcspec.review.DecisionKey
    kind: struct
    naming:
      summary: >-
        A decision's identity: the profile whose overlay holds it, the item's stable id and the
        digest of the text it judged. Overlays are per profile, so two profiles each hold their own
        decision on one item and digest.
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: item
        type: rfcspec.catalogue.ItemId
      - name: text_digest
        type: rfcspec.catalogue.Digest

  - name: rfcspec.review.ProposalTask
    kind: enum
    naming:
      summary: What S3 was asked to propose (design sections 4, 5, 8.3 and 9).
    variants:
      - name: ClassifyKind
        wire: classify-kind
      - name: Party
        wire: party
      - name: CommunicationSemantics
        wire: communication-semantics
      - name: Machine
        wire: machine
      - name: Constraint
        wire: constraint
      - name: BitWidths
        wire: bit-widths
      - name: ImportMapping
        wire: import-mapping
      - name: RequirementFromProse
        wire: requirement-from-prose
      - name: RequirementLink
        wire: requirement-link
        summary: A link from a requirement to a model element.
      - name: Dialect
        wire: dialect
        summary: The ABNF dialect of a figure.

  - name: rfcspec.review.Verdict
    kind: enum
    naming:
      summary: How a reviewer settles a proposal.
    variants:
      - name: Accept
        wire: accept
      - name: Edit
        wire: edit
      - name: Reject
        wire: reject

  - name: rfcspec.review.DecisionKind
    kind: enum
    naming:
      summary: What an overlay entry does to its item.
    variants:
      - name: Accept
        wire: accept
      - name: Edit
        wire: edit
      - name: Reject
        wire: reject
      - name: Erratum
        wire: erratum
        summary: A verified RFC Editor erratum replacing the judged text; only verified errata are applied.

  - name: rfcspec.review.ErrataStatus
    kind: enum
    naming:
      summary: The status the RFC Editor gives an erratum.
    variants:
      - name: Verified
        wire: verified
      - name: Reported
        wire: reported
      - name: Held
        wire: held
        summary: Held for document update.
      - name: Rejected
        wire: rejected

entities:
  - name: rfcspec.review.Proposal
    naming:
      summary: >-
        A typed, schema-checked document from S3: the model id, a digest of the prompt and
        inputs, the response and the spans it cites, about one item named by its stable id.
        Stored under the profile's proposals and replayed, so every later stage is offline.
    identity:
      name: proposal_id
      type: rfcspec.review.ProposalId
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: item
        type: rfcspec.catalogue.ItemId
        summary: The item the proposal is about.
      - name: task
        type: rfcspec.review.ProposalTask
      - name: model_id
        type: rfcspec.review.ModelId
      - name: input_digest
        type: rfcspec.catalogue.Digest
        summary: Digest of the prompt and inputs.
      - name: response
        type: Json
      - name: cited_spans
        type: List<rfcspec.catalogue.Span>
      - name: decision
        type: Optional<rfcspec.review.DecisionKey>
        summary: The overlay decision that settled the proposal.
    relations:
      - name: profile
        kind: references
        target: rfcspec.profile.Profile
        cardinality: one
        via: profile
      - name: decision
        kind: references
        target: rfcspec.review.Decision
        cardinality: one
        via: decision
    lifecycle:
      initial: Recorded
      states:
        - name: Recorded
          wire: recorded
          summary: Passed its mechanical checks and awaits review.
        - name: Accepted
          wire: accepted
        - name: Edited
          wire: edited
          summary: Accepted with a reviewer's edit.
        - name: Rejected
          wire: rejected
      terminal: [Accepted, Edited, Rejected]
      transitions:
        - name: accept
          from: [Recorded]
          to: Accepted
        - name: edit
          from: [Recorded]
          to: Edited
        - name: reject
          from: [Recorded]
          to: Rejected

  - name: rfcspec.review.Decision
    naming:
      summary: >-
        An entry of a profile's overlay: accept, edit, reject or erratum for one item, keyed by
        the profile, the item's stable id and the digest of the text it judged. Human decisions and recorded
        AI proposals reach the catalogue only through such an entry. Confirming a stale decision
        records a new Current decision with the new digest; the old one stays Stale.
    identity:
      name: key
      type: rfcspec.review.DecisionKey
    fields:
      - name: profile
        type: rfcspec.profile.ProfileName
        summary: The key's profile.
      - name: item
        type: rfcspec.catalogue.ItemId
        summary: The key's item.
      - name: text_digest
        type: rfcspec.catalogue.Digest
        summary: The key's text digest.
      - name: kind
        type: rfcspec.review.DecisionKind
      - name: proposal_id
        type: Optional<rfcspec.review.ProposalId>
        summary: The proposal decided, absent for a decision made without one.
      - name: edit
        type: Optional<Json>
        summary: The replacement item of an edit, in the catalogue's own shape for that item kind.
      - name: errata_id
        type: Optional<Integer>
        summary: The RFC Editor errata id of an erratum.
      - name: errata_status
        type: Optional<rfcspec.review.ErrataStatus>
        summary: The RFC Editor's status of an erratum; only a verified erratum is recorded.
      - name: corrected_text
        type: Optional<String>
        summary: The corrected text of an erratum; text_digest is the digest of the original text.
      - name: confirms
        type: Optional<rfcspec.review.DecisionKey>
        summary: The stale decision this one confirms against the changed text.
    invariants:
      - any: [kind != Edit, defined(edit)]
      - any: [kind != Erratum, defined(errata_id)]
      - any: [kind != Erratum, defined(corrected_text)]
      - any: [kind != Erratum, errata_status == Verified]
    relations:
      - name: profile
        kind: references
        target: rfcspec.profile.Profile
        cardinality: one
        via: profile
      - name: proposal
        kind: references
        target: rfcspec.review.Proposal
        cardinality: one
        via: proposal_id
      - name: confirms
        kind: references
        target: rfcspec.review.Decision
        cardinality: one
        via: confirms
    lifecycle:
      initial: Current
      states:
        - name: Current
          wire: current
          summary: The judged text still matches; the decision is applied.
        - name: Stale
          wire: stale
          summary: The judged text changed on re-import; the decision is kept and not applied.
      terminal: [Stale]
      transitions:
        - name: mark_stale
          from: [Current]
          to: Stale

actors:
  - name: rfcspec.review.Proposer
    naming:
      display: Proposer
      summary: >-
        Stage S3. Calls go through the shared LLM crates; no gate calls a model. It records
        proposals only and changes no catalogue or profile item.
    may:
      - rfcspec.review.RecordProposal

  - name: rfcspec.review.Reviewer
    naming:
      display: Reviewer
      summary: >-
        Stage S4, which writes the overlay: decisions on proposals and items, verified errata,
        and, each under a Current decision, requirements from prose, requirement review states
        and levels, confirmations of stale items, RFC kinds, grammar dialects, profile semantics,
        and the statuses unsupported and not-applicable.
    may:
      - rfcspec.review.RecordDecision
      - rfcspec.review.DecideProposal
      - rfcspec.review.ConfirmDecision
      - rfcspec.catalogue.ProposeRequirement
      - rfcspec.catalogue.AcceptRequirement
      - rfcspec.catalogue.RejectRequirement
      - rfcspec.catalogue.SetRequirementLevel
      - rfcspec.catalogue.ClassifyRfc
      - rfcspec.catalogue.SetGrammarDialect
      - rfcspec.catalogue.ConfirmSection
      - rfcspec.catalogue.ConfirmDefinedTerm
      - rfcspec.catalogue.ConfirmGrammar
      - rfcspec.catalogue.ConfirmLayout
      - rfcspec.catalogue.ConfirmLimit
      - rfcspec.profile.ReviseProfile
      - rfcspec.profile.RecordStatus

errors:
  - name: rfcspec.review.ProposalCheckFailed
    summary: >-
      A mechanical check failed before a human saw the proposal: a cited span or quote does not
      occur verbatim in the locked source, or a task-specific check (design section 9) failed.
    fields:
      - name: proposal_id
        type: rfcspec.review.ProposalId

  - name: rfcspec.review.ProposalStateConflict
    summary: The proposal was already decided, so nothing moved.
    fields:
      - name: state
        type: rfcspec.review.Proposal.State

  - name: rfcspec.review.ProposalNotFound
    fields:
      - name: proposal_id
        type: rfcspec.review.ProposalId

  - name: rfcspec.review.DecisionIncomplete
    summary: An edit names no replacement item, or an erratum no errata id or corrected text, and nothing was recorded.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.review.DecisionNotStale
    summary: The decision to confirm does not exist or is not stale, and nothing was recorded.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.review.DecisionNotFound
    summary: No decision has the key, and nothing changed.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.review.DecisionNotCurrent
    summary: The decision named is Stale and is not applied until a reviewer confirms it, so nothing changed.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.review.DecisionMismatch
    summary: >-
      The decision named is for another profile, item or text, or its kind does not match what
      the command does, so nothing changed.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.review.ErratumNotVerified
    summary: An erratum decision names an erratum the RFC Editor has not verified, and nothing was recorded.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.review.AlreadyExists
    summary: A record with this identity already exists, and nothing was recorded.
    fields: []

commands:
  - name: rfcspec.review.RecordProposal
    naming:
      wire: record-proposal
      display: Record a proposal
    input:
      - name: proposal_id
        type: rfcspec.review.ProposalId
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: item
        type: rfcspec.catalogue.ItemId
      - name: task
        type: rfcspec.review.ProposalTask
      - name: model_id
        type: rfcspec.review.ModelId
      - name: input_digest
        type: rfcspec.catalogue.Digest
      - name: response
        type: Json
      - name: cited_spans
        type: List<rfcspec.catalogue.Span>
    outcomes:
      - name: recorded
        creates: rfcspec.review.Proposal
        instance: proposal_id
        emits:
          - rfcspec.review.ProposalRecorded
        payload:
          rfcspec.review.ProposalRecorded:
            proposal_id: input.proposal_id
            item: input.item
            task: input.task
        sets:
          profile: input.profile
          item: input.item
          task: input.task
          model_id: input.model_id
          input_digest: input.input_digest
          response: input.response
          cited_spans: input.cited_spans
        summary: The proposal is recorded and awaits review; it changes nothing yet.
      - name: check-failed
        external: a cited span or quote does not occur in the locked source, or a task-specific mechanical check fails
        error: rfcspec.review.ProposalCheckFailed
        payload:
          rfcspec.review.ProposalCheckFailed:
            proposal_id: input.proposal_id
        summary: Nothing is recorded for review.
      - name: already-exists
        existing_instance: true
        error: rfcspec.review.AlreadyExists
        summary: >-
          A proposal with this id is already recorded; replay reads it instead of recording it
          again, and nothing changes.

  - name: rfcspec.review.DecideProposal
    naming:
      wire: decide-proposal
      display: Decide a proposal
    input:
      - name: proposal_id
        type: rfcspec.review.ProposalId
      - name: verdict
        type: rfcspec.review.Verdict
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-item
        when_subject:
          predicate:
            any: [item != input.decision.item, profile != input.decision.profile]
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item or profile, and the proposal stays Recorded.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the proposal stays Recorded.
      - name: kind-mismatch
        when_related:
          via: input.decision
          predicate:
            any:
              - all: [input.verdict == Accept, kind != Accept]
              - all: [input.verdict == Edit, kind != Edit]
              - all: [input.verdict == Reject, kind != Reject]
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision's kind is not the verdict, and the proposal stays Recorded.
      - name: accepted
        when: verdict == Accept
        moves: rfcspec.review.Proposal.accept
        instance: proposal_id
        emits:
          - rfcspec.review.ProposalDecided
        payload:
          rfcspec.review.ProposalDecided:
            proposal_id: input.proposal_id
            verdict: input.verdict
        sets:
          decision: input.decision
        summary: The proposal is Accepted.
      - name: edited
        when: verdict == Edit
        moves: rfcspec.review.Proposal.edit
        instance: proposal_id
        emits:
          - rfcspec.review.ProposalDecided
        payload:
          rfcspec.review.ProposalDecided:
            proposal_id: input.proposal_id
            verdict: input.verdict
        sets:
          decision: input.decision
        summary: The proposal is accepted with an edit.
      - name: rejected
        moves: rfcspec.review.Proposal.reject
        instance: proposal_id
        emits:
          - rfcspec.review.ProposalDecided
        payload:
          rfcspec.review.ProposalDecided:
            proposal_id: input.proposal_id
            verdict: input.verdict
        sets:
          decision: input.decision
        summary: The proposal is Rejected and changes nothing.
      - name: unknown
        unknown_instance: true
        error: rfcspec.review.ProposalNotFound
        summary: No proposal has this id.
      - name: wrong-state
        wrong_state: true
        error: rfcspec.review.ProposalStateConflict
        summary: The proposal was already decided.

  - name: rfcspec.review.RecordDecision
    naming:
      wire: record-decision
      display: Record a decision
    input:
      - name: key
        type: rfcspec.review.DecisionKey
      - name: kind
        type: rfcspec.review.DecisionKind
      - name: proposal_id
        type: Optional<rfcspec.review.ProposalId>
      - name: edit
        type: Optional<Json>
      - name: errata_id
        type: Optional<Integer>
      - name: errata_status
        type: Optional<rfcspec.review.ErrataStatus>
      - name: corrected_text
        type: Optional<String>
    outcomes:
      - name: incomplete
        when:
          any:
            - all: [kind == Edit, not defined(edit)]
            - all: [kind == Erratum, not defined(errata_id)]
            - all: [kind == Erratum, not defined(corrected_text)]
            - all: [kind == Erratum, not defined(errata_status)]
        error: rfcspec.review.DecisionIncomplete
        payload:
          rfcspec.review.DecisionIncomplete:
            item: input.key.item
        summary: The decision lacks what its kind needs, and nothing was recorded.
      - name: erratum-not-verified
        when:
          all: [kind == Erratum, defined(errata_status), errata_status != Verified]
        error: rfcspec.review.ErratumNotVerified
        payload:
          rfcspec.review.ErratumNotVerified:
            item: input.key.item
        summary: Only a verified erratum enters the overlay.
      - name: already-exists
        existing_instance: true
        error: rfcspec.review.AlreadyExists
        summary: The overlay already holds a decision under this key, and nothing was recorded.
      - name: recorded
        creates: rfcspec.review.Decision
        instance: key
        emits:
          - rfcspec.review.DecisionRecorded
        payload:
          rfcspec.review.DecisionRecorded:
            key: input.key
            kind: input.kind
        sets:
          profile: input.key.profile
          item: input.key.item
          text_digest: input.key.text_digest
          kind: input.kind
          proposal_id: input.proposal_id
          edit: input.edit
          errata_id: input.errata_id
          errata_status: input.errata_status
          corrected_text: input.corrected_text
        summary: The decision is in the profile's overlay and applied.

  - name: rfcspec.review.MarkDecisionStale
    naming:
      wire: mark-decision-stale
      display: Mark a decision stale
    input:
      - name: key
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: stale
        moves: rfcspec.review.Decision.mark_stale
        instance: key
        emits:
          - rfcspec.review.DecisionStale
        payload:
          rfcspec.review.DecisionStale:
            key: input.key
        summary: Re-import changed the judged text; the decision is kept and no longer applied.
      - name: unknown
        unknown_instance: true
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.key.item
        summary: No decision has the key, and nothing changed.
      - name: already-stale
        wrong_state: true
        refuses: false
        summary: A stale decision stays stale.

  - name: rfcspec.review.ConfirmDecision
    naming:
      wire: confirm-decision
      display: Confirm a stale decision
      summary: >-
        A reviewer confirms a stale decision against the changed text: a new Current decision is
        recorded under the new digest, and the stale one stays as it is.
    input:
      - name: key
        type: rfcspec.review.DecisionKey
      - name: confirms
        type: rfcspec.review.DecisionKey
      - name: kind
        type: rfcspec.review.DecisionKind
      - name: proposal_id
        type: Optional<rfcspec.review.ProposalId>
      - name: edit
        type: Optional<Json>
      - name: errata_id
        type: Optional<Integer>
      - name: errata_status
        type: Optional<rfcspec.review.ErrataStatus>
      - name: corrected_text
        type: Optional<String>
    outcomes:
      - name: incomplete
        when:
          any:
            - all: [kind == Edit, not defined(edit)]
            - all: [kind == Erratum, not defined(errata_id)]
            - all: [kind == Erratum, not defined(corrected_text)]
            - all: [kind == Erratum, not defined(errata_status)]
        error: rfcspec.review.DecisionIncomplete
        payload:
          rfcspec.review.DecisionIncomplete:
            item: input.key.item
        summary: The decision lacks what its kind needs, and nothing was recorded.
      - name: erratum-not-verified
        when:
          all: [kind == Erratum, defined(errata_status), errata_status != Verified]
        error: rfcspec.review.ErratumNotVerified
        payload:
          rfcspec.review.ErratumNotVerified:
            item: input.key.item
        summary: Only a verified erratum enters the overlay.
      - name: already-exists
        existing_instance: true
        error: rfcspec.review.AlreadyExists
        summary: The overlay already holds a decision under the new key, and nothing was recorded.
      - name: missing
        when_related: {via: input.confirms, exists: false}
        error: rfcspec.review.DecisionNotStale
        payload:
          rfcspec.review.DecisionNotStale:
            item: input.confirms.item
        summary: No decision has the key to confirm.
      - name: other-item
        when_related:
          via: input.confirms
          predicate:
            any:
              - profile != input.key.profile
              - item != input.key.item
              - text_digest == input.key.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.key.item
        summary: >-
          A confirmation stays with the stale decision's profile and item and judges a changed
          text; anything else is refused and nothing was recorded.
      - name: not-stale
        when_related: {via: input.confirms, predicate: state != Stale}
        error: rfcspec.review.DecisionNotStale
        payload:
          rfcspec.review.DecisionNotStale:
            item: input.confirms.item
        summary: The decision to confirm still applies.
      - name: confirmed
        creates: rfcspec.review.Decision
        instance: key
        emits:
          - rfcspec.review.DecisionConfirmed
        payload:
          rfcspec.review.DecisionConfirmed:
            key: input.key
            confirms: input.confirms
        sets:
          profile: input.key.profile
          item: input.key.item
          text_digest: input.key.text_digest
          kind: input.kind
          proposal_id: input.proposal_id
          edit: input.edit
          errata_id: input.errata_id
          errata_status: input.errata_status
          corrected_text: input.corrected_text
          confirms: input.confirms
        summary: A new Current decision applies under the new digest.

events:
  - name: rfcspec.review.ProposalRecorded
    fields:
      - name: proposal_id
        type: rfcspec.review.ProposalId
      - name: item
        type: rfcspec.catalogue.ItemId
      - name: task
        type: rfcspec.review.ProposalTask

  - name: rfcspec.review.ProposalDecided
    fields:
      - name: proposal_id
        type: rfcspec.review.ProposalId
      - name: verdict
        type: rfcspec.review.Verdict

  - name: rfcspec.review.DecisionRecorded
    fields:
      - name: key
        type: rfcspec.review.DecisionKey
      - name: kind
        type: rfcspec.review.DecisionKind

  - name: rfcspec.review.DecisionStale
    fields:
      - name: key
        type: rfcspec.review.DecisionKey

  - name: rfcspec.review.DecisionConfirmed
    fields:
      - name: key
        type: rfcspec.review.DecisionKey
      - name: confirms
        type: rfcspec.review.DecisionKey

views:
  - name: rfcspec.review.Proposals
    source: rfcspec.review.Proposal
    consistency: read_your_writes
    naming:
      wire: proposals
      display: Proposals
    fields:
      - name: proposal_id
        type: rfcspec.review.ProposalId
      - name: state
        type: rfcspec.review.Proposal.State
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: item
        type: rfcspec.catalogue.ItemId
      - name: task
        type: rfcspec.review.ProposalTask
      - name: model_id
        type: rfcspec.review.ModelId
      - name: input_digest
        type: rfcspec.catalogue.Digest
      - name: response
        type: Json
      - name: decision
        type: Optional<rfcspec.review.DecisionKey>

  - name: rfcspec.review.Decisions
    source: rfcspec.review.Decision
    consistency: read_your_writes
    naming:
      wire: decisions
      display: Decisions
    fields:
      - name: key
        type: rfcspec.review.DecisionKey
      - name: state
        type: rfcspec.review.Decision.State
      - name: profile
        type: rfcspec.profile.ProfileName
      - name: kind
        type: rfcspec.review.DecisionKind
      - name: proposal_id
        type: Optional<rfcspec.review.ProposalId>
      - name: edit
        type: Optional<Json>
      - name: errata_id
        type: Optional<Integer>
      - name: errata_status
        type: Optional<rfcspec.review.ErrataStatus>
      - name: corrected_text
        type: Optional<String>
      - name: confirms
        type: Optional<rfcspec.review.DecisionKey>
