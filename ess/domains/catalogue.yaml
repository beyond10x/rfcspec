        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the grammar is unchanged.
      - name: set
        updates: rfcspec.catalogue.Grammar
        instance: grammar_id
        emits:
          - rfcspec.catalogue.GrammarDialectSet
        payload:
          rfcspec.catalogue.GrammarDialectSet:
            grammar_id: input.grammar_id
            dialect: input.dialect
        sets:
          dialect: input.dialect
        summary: The grammar carries the dialect.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.grammar_id
        summary: No grammar has this id.

  - name: rfcspec.catalogue.MarkGrammarStale
    naming:
      wire: mark-grammar-stale
      display: Mark a grammar stale
      summary: Re-import found that the grammar's span no longer matches; the grammar keeps its id and records the new span.
    input:
      - name: grammar_id
        type: rfcspec.catalogue.ItemId
      - name: span
        type: rfcspec.catalogue.Span
    outcomes:
      - name: stale
        moves: rfcspec.catalogue.Grammar.mark_stale
        instance: grammar_id
        emits:
          - rfcspec.catalogue.GrammarStale
        payload:
          rfcspec.catalogue.GrammarStale:
            grammar_id: input.grammar_id
        sets:
          span: input.span
        summary: The grammar is Stale until a reviewer confirms it.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.grammar_id
        summary: No grammar has this id.
      - name: already-stale
        wrong_state: true
        refuses: false
        summary: A stale grammar stays stale.

  - name: rfcspec.catalogue.ConfirmGrammar
    naming:
      wire: confirm-grammar
      display: Confirm a stale grammar
      summary: A reviewer confirms a stale grammar against its changed text under a Current decision on that text.
    input:
      - name: grammar_id
        type: rfcspec.catalogue.ItemId
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision judged another text than the grammar's span, and the grammar is unchanged.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the grammar is unchanged.
      - name: other-item
        when_related: {via: input.decision, predicate: item != input.grammar_id}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item, and the grammar is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the grammar is unchanged.
      - name: confirmed
        moves: rfcspec.catalogue.Grammar.confirm
        instance: grammar_id
        emits:
          - rfcspec.catalogue.GrammarConfirmed
        payload:
          rfcspec.catalogue.GrammarConfirmed:
            grammar_id: input.grammar_id
        summary: The grammar is current again.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.grammar_id
        summary: No grammar has this id.
      - name: wrong-state
        wrong_state: true
        error: rfcspec.catalogue.ItemNotStale
        payload:
          rfcspec.catalogue.ItemNotStale:
            item: input.grammar_id
        summary: Only a stale grammar is confirmed.

  - name: rfcspec.catalogue.ExtractLayout
    naming:
      wire: extract-layout
      display: Extract a layout
    input:
      - name: layout_id
        type: rfcspec.catalogue.ItemId
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: name
        type: String
      - name: fields
        type: List<rfcspec.catalogue.LayoutField>
      - name: span
        type: rfcspec.catalogue.Span
    outcomes:
      - name: extracted
        creates: rfcspec.catalogue.Layout
        instance: layout_id
        emits:
          - rfcspec.catalogue.LayoutExtracted
        payload:
          rfcspec.catalogue.LayoutExtracted:
            layout_id: input.layout_id
        sets:
          rfc: input.rfc
          name: input.name
          fields: input.fields
          span: input.span
        summary: The layout is in the catalogue.
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: The layout is already in the catalogue, and nothing was recorded.

  - name: rfcspec.catalogue.MarkLayoutStale
    naming:
      wire: mark-layout-stale
      display: Mark a layout stale
      summary: Re-import found that the layout's span no longer matches; the layout keeps its id and records the new span.
    input:
      - name: layout_id
        type: rfcspec.catalogue.ItemId
      - name: span
        type: rfcspec.catalogue.Span
    outcomes:
      - name: stale
        moves: rfcspec.catalogue.Layout.mark_stale
        instance: layout_id
