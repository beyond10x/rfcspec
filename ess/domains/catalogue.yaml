domain: rfcspec.catalogue

summary: >-
  The rfcspec/1 catalogue: what an RFC states, read from a locked source. Every item carries its
  provenance, either a span of an RFC or an IANA source. The catalogue is data about the RFC, not
  yet a specification of a system.

naming:
  wire: catalogue
  display: Catalogue

types:
  - name: rfcspec.catalogue.RfcNumber
    kind: newtype
    of: Integer
    naming:
      summary: The RFC Editor's number of the document.

  - name: rfcspec.catalogue.ItemId
    kind: newtype
    of: String
    alphabet: "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789/.-_"
    naming:
      summary: >-
        The stable id of a catalogue or profile item, its kind in the spelling. Section
        rfc<N>/s/<anchor-or-number>; Requirement rfc<N>/R<section>-<ordinal>, the ordinal counting
        requirements in document order within the section; DefinedTerm rfc<N>/term/<slug>;
        Grammar rfc<N>/grammar/<slug>; Layout rfc<N>/layout/<slug>; Limit rfc<N>/limit/<slug>.
        A whole RFC is rfc<N> and a whole profile <profile>. A published RFC's ids never shift.
        Machines and statuses are keyed by structs (profile and slug, profile and requirement),
        not by an item id.

  - name: rfcspec.catalogue.Digest
    kind: newtype
    of: String
    alphabet: "0123456789abcdef"
    naming:
      summary: A SHA-256 digest in lower-case hexadecimal.

  - name: rfcspec.catalogue.YearMonth
    kind: newtype
    of: String
    alphabet: "0123456789-"
    invariants:
      - value.count == 7
    naming:
      summary: A month written YYYY-MM; the index gives month and year.

  - name: rfcspec.catalogue.SourceFormat
    kind: enum
    naming:
      summary: The format the RFC was read from, RFCXML v3 where the index lists it, plain text otherwise.
    variants:
      - name: Xml
        wire: xml
      - name: Text
        wire: text

  - name: rfcspec.catalogue.Span
    kind: struct
    naming:
      summary: >-
        Provenance in an RFC: the RFC, the section anchor (XML) or number (text), a byte range in
        the normalized text, and the SHA-256 of the spanned text.
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: section
        type: String
        summary: The section anchor when read from XML, the section number when read from text.
      - name: start
        type: Integer
      - name: end
        type: Integer
      - name: digest
        type: rfcspec.catalogue.Digest
        summary: SHA-256 of the spanned text; a mismatch after re-import makes the item stale.
    invariants:
      - start >= 0
      - end >= start

  - name: rfcspec.catalogue.RegistryId
    kind: newtype
    of: String
    naming:
      summary: The IANA identifier of a registry, such as close-code-number.

  - name: rfcspec.catalogue.IanaSource
    kind: struct
    naming:
      summary: Provenance in IANA's registry XML, the form a registry carries instead of a span.
    fields:
      - name: registry_id
        type: rfcspec.catalogue.RegistryId
      - name: digest
        type: rfcspec.catalogue.Digest
        summary: SHA-256 of the locked registry file.

  - name: rfcspec.catalogue.PartyName
    kind: newtype
    of: String
    naming:
      summary: A named party of a protocol, such as client, server, resolver, proxy, sender or recipient.

  - name: rfcspec.catalogue.Bcp14Level
    kind: enum
    naming:
      summary: The eleven BCP 14 keywords.
    variants:
      - name: Must
        wire: MUST
      - name: MustNot
        wire: MUST NOT
      - name: Required
        wire: REQUIRED
      - name: Shall
        wire: SHALL
      - name: ShallNot
        wire: SHALL NOT
      - name: Should
        wire: SHOULD
      - name: ShouldNot
        wire: SHOULD NOT
      - name: Recommended
        wire: RECOMMENDED
      - name: NotRecommended
        wire: NOT RECOMMENDED
      - name: May
        wire: MAY
      - name: Optional
        wire: OPTIONAL

  - name: rfcspec.catalogue.RequirementSource
    kind: enum
    naming:
      summary: How a requirement was found.
    variants:
      - name: Bcp14Xml
        wire: bcp14-xml
        summary: A sentence containing a bcp14 element in RFCXML.
      - name: CapitalsText
        wire: capitals-text
        summary: A sentence of the plain text containing a BCP 14 keyword in capitals, outside the boilerplate paragraph citing RFC 2119.
      - name: AbnfComment
        wire: abnf-comment
        summary: A keyword inside an ABNF comment.
      - name: Prose
        wire: prose
        summary: Proposed from prose in an RFC before BCP 14; every one needs review.

  - name: rfcspec.catalogue.RuleImport
    kind: struct
    naming:
      summary: A grammar's use of another RFC's ABNF rule.
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: rule
        type: String

  - name: rfcspec.catalogue.AbnfDialect
    kind: enum
    naming:
      summary: >-
        The ABNF dialect a grammar is written in, proposed per figure and reviewed (design section
        8.3). The bits dialect is the bit-level case, as in RFC 6455 section 5.2.
    variants:
      - name: Rfc5234
        wire: rfc5234
      - name: Rfc2616
        wire: rfc2616
      - name: Bits
        wire: bits

  - name: rfcspec.catalogue.LengthUnit
    kind: enum
    variants:
      - name: Bits
        wire: bits
      - name: Octets
        wire: octets

  - name: rfcspec.catalogue.DependentLength
    kind: struct
    naming:
      summary: A field's length read from another field of the layout.
    fields:
      - name: field
        type: String
      - name: unit
        type: rfcspec.catalogue.LengthUnit

  - name: rfcspec.catalogue.Presence
    kind: struct
    naming:
      summary: A field is present when another field of the layout equals the value.
    fields:
      - name: field
        type: String
      - name: equals
        type: Integer

  - name: rfcspec.catalogue.ConstraintKind
    kind: enum
    variants:
      - name: Equals
        wire: equals
      - name: Range
        wire: range
      - name: OneOf
        wire: one_of

  - name: rfcspec.catalogue.FieldConstraint
    kind: struct
    naming:
      summary: A constraint on a field's value; a range gives its lower and upper bound.
    fields:
      - name: kind
        type: rfcspec.catalogue.ConstraintKind
      - name: values
        type: List<Integer>

  - name: rfcspec.catalogue.LayoutField
    kind: struct
    naming:
      summary: One field of a parsed packet diagram.
    fields:
      - name: name
        type: String
      - name: bits
        type: Optional<Integer>
        summary: The bit width, absent where the length depends on another field.
      - name: length
        type: Optional<rfcspec.catalogue.DependentLength>
      - name: presence
        type: Optional<rfcspec.catalogue.Presence>
      - name: constraints
        type: List<rfcspec.catalogue.FieldConstraint>

  - name: rfcspec.catalogue.RegistryPolicy
    kind: enum
    naming:
      summary: >-
        Whether a registry is lowered to a closed enum or an open one that keeps an unassigned
        path for values IANA assigns later.
    variants:
      - name: Open
        wire: open
      - name: Closed
        wire: closed

  - name: rfcspec.catalogue.ValueKind
    kind: enum
    variants:
      - name: Number
        wire: number
      - name: Name
        wire: name

  - name: rfcspec.catalogue.RegistryEntry
    kind: struct
    fields:
      - name: value
        type: String
        summary: The registry value; a number is written in decimal.
      - name: value_kind
        type: rfcspec.catalogue.ValueKind
      - name: name
        type: String
      - name: reference
        type: String
      - name: status
        type: String

  - name: rfcspec.catalogue.RfcKind
    kind: enum
    naming:
      summary: The primary kind of an RFC (design section 2.3), partly proposed and reviewed.
    variants:
      - name: WireProtocol
        wire: K1
      - name: DataFormat
        wire: K2
      - name: Algorithm
        wire: K3
      - name: Extension
        wire: K4
      - name: RegistryProcedure
        wire: K5
      - name: ManagementModel
        wire: K6
      - name: Informational
        wire: K7
      - name: NotASpecification
        wire: K8

entities:
  - name: rfcspec.catalogue.Rfc
    naming:
      summary: One RFC as the index describes it and as it was read from its locked source.
    identity:
      name: number
      type: rfcspec.catalogue.RfcNumber
    fields:
      - name: title
        type: String
      - name: status
        type: String
        summary: The publication status the index gives, such as Proposed Standard.
      - name: stream
        type: String
      - name: area
        type: Optional<String>
        summary: Many index entries carry no area.
      - name: date
        type: rfcspec.catalogue.YearMonth
      - name: format_read
        type: rfcspec.catalogue.SourceFormat
      - name: digest
        type: rfcspec.catalogue.Digest
        summary: SHA-256 of the locked source file.
      - name: kind
        type: Optional<rfcspec.catalogue.RfcKind>
        summary: The RFC's primary kind, absent until classified.
      - name: obsoletes
        type: List<Integer>
        summary: >-
          Update graph edges from the index name RFC numbers, not catalogue entries, so they may
          name an RFC that was never read. Fetch lists updated-by RFCs as candidates and never
          adds them silently.
      - name: obsoleted_by
        type: List<Integer>
      - name: updates
        type: List<Integer>
      - name: updated_by
        type: List<Integer>
    relations:
      - name: sections
        kind: owns
        target: rfcspec.catalogue.Section
        cardinality: many
        via: rfc
      - name: terms
        kind: owns
        target: rfcspec.catalogue.DefinedTerm
        cardinality: many
        via: rfc
      - name: grammars
        kind: owns
        target: rfcspec.catalogue.Grammar
        cardinality: many
        via: rfc
      - name: layouts
        kind: owns
        target: rfcspec.catalogue.Layout
        cardinality: many
        via: rfc
      - name: limits
        kind: owns
        target: rfcspec.catalogue.Limit
        cardinality: many
        via: rfc
    lifecycle:
      initial: Read
      states: [Read]
      terminal: [Read]

  - name: rfcspec.catalogue.Section
    naming:
      summary: A section of an RFC, from the XML section tree or recovered from the text's table of contents and numbering.
    identity:
      name: section_id
      type: rfcspec.catalogue.ItemId
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: anchor
        type: String
        summary: The section anchor (XML) or number (text).
      - name: title
        type: String
      - name: parent
        type: Optional<rfcspec.catalogue.ItemId>
      - name: span
        type: rfcspec.catalogue.Span
    relations:
      - name: parent
        kind: references
        target: rfcspec.catalogue.Section
        cardinality: one
        via: parent
      - name: requirements
        kind: owns
        target: rfcspec.catalogue.Requirement
        cardinality: many
        via: section_id
    lifecycle:
      initial: Read
      states:
        - name: Read
          wire: read
          summary: Read from the locked source; its span matches the spanned text.
        - name: Stale
          wire: stale
          summary: Its span no longer matches after re-import; it is not used until a reviewer confirms it.
      terminal: []
      transitions:
        - name: mark_stale
          from: [Read]
          to: Stale
          summary: Re-import found the spanned text changed; the id is kept.
        - name: confirm
          from: [Stale]
          to: Read
          summary: A reviewer confirmed it against the changed text under a Current decision.

  - name: rfcspec.catalogue.Requirement
    naming:
      summary: >-
        One sentence of an RFC that states a requirement. S2 finds most mechanically; S3 proposes
        them from prose for RFCs before BCP 14. The lifecycle is the requirement's review state.
    identity:
      name: requirement_id
      type: rfcspec.catalogue.ItemId
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: section_id
        type: rfcspec.catalogue.ItemId
      - name: ordinal
        type: Integer
      - name: level
        type: Optional<rfcspec.catalogue.Bcp14Level>
        summary: >-
          The BCP 14 keyword of the sentence. A requirement from a BCP 14 source always carries
          one; a prose requirement has none until a reviewer sets it (a lower-case should is
          proposed as SHOULD).
      - name: party
        type: Optional<rfcspec.catalogue.PartyName>
        summary: The party the requirement binds, proposed in S3 and set only by a review decision.
      - name: text
        type: String
      - name: span
        type: rfcspec.catalogue.Span
      - name: source
        type: rfcspec.catalogue.RequirementSource
    invariants:
      - any: [source == Prose, defined(level)]
    relations:
      - name: rfc
        kind: references
        target: rfcspec.catalogue.Rfc
        cardinality: one
        via: rfc
    lifecycle:
      initial: Extracted
      states:
        - name: Extracted
          wire: extracted
          summary: Found by S2; no review decision applies.
        - name: Accepted
          wire: accepted
          summary: A review decision accepted it, possibly edited.
        - name: Rejected
          wire: rejected
          summary: A review decision rejected it.
        - name: Stale
          wire: stale
          summary: Its span no longer matches after re-import; its decisions are not applied until a reviewer confirms them.
      terminal: []
      transitions:
        - name: accept
          from: [Extracted, Stale]
          to: Accepted
        - name: reject
          from: [Extracted, Stale]
          to: Rejected
        - name: mark_stale
          from: [Extracted, Accepted, Rejected]
          to: Stale
          summary: Re-import found the spanned text changed; the id is kept.

  - name: rfcspec.catalogue.DefinedTerm
    naming:
      summary: >-
        A phrase the RFC defines and invokes, such as Fail the WebSocket Connection; such terms
        become named procedures in machines.
    identity:
      name: term_id
      type: rfcspec.catalogue.ItemId
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: name
        type: String
      - name: span
        type: rfcspec.catalogue.Span
    lifecycle:
      initial: Read
      states:
        - name: Read
          wire: read
          summary: Read from the locked source; its span matches the spanned text.
        - name: Stale
          wire: stale
          summary: Its span no longer matches after re-import; it is not used until a reviewer confirms it.
      terminal: []
      transitions:
        - name: mark_stale
          from: [Read]
          to: Stale
          summary: Re-import found the spanned text changed; the id is kept.
        - name: confirm
          from: [Stale]
          to: Read
          summary: A reviewer confirmed it against the changed text under a Current decision.

  - name: rfcspec.catalogue.Grammar
    naming:
      summary: ABNF rules of an RFC, kept verbatim.
    identity:
      name: grammar_id
      type: rfcspec.catalogue.ItemId
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: name
        type: String
      - name: rules
        type: String
        summary: The ABNF rules verbatim.
      - name: uses
        type: List<rfcspec.catalogue.RuleImport>
      - name: dialect
        type: Optional<rfcspec.catalogue.AbnfDialect>
        summary: Proposed in S3 and reviewed; absent until then.
      - name: span
        type: rfcspec.catalogue.Span
    lifecycle:
      initial: Read
      states:
        - name: Read
          wire: read
          summary: Read from the locked source; its span matches the spanned text.
        - name: Stale
          wire: stale
          summary: Its span no longer matches after re-import; it is not used until a reviewer confirms it.
      terminal: []
      transitions:
        - name: mark_stale
          from: [Read]
          to: Stale
          summary: Re-import found the spanned text changed; the id is kept.
        - name: confirm
          from: [Stale]
          to: Read
          summary: A reviewer confirmed it against the changed text under a Current decision.

  - name: rfcspec.catalogue.Layout
    naming:
      summary: A packet diagram parsed to fields with bit widths, dependent lengths, presence conditions and constraints.
    identity:
      name: layout_id
      type: rfcspec.catalogue.ItemId
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: name
        type: String
      - name: fields
        type: List<rfcspec.catalogue.LayoutField>
      - name: span
        type: rfcspec.catalogue.Span
    lifecycle:
      initial: Read
      states:
        - name: Read
          wire: read
          summary: Read from the locked source; its span matches the spanned text.
        - name: Stale
          wire: stale
          summary: Its span no longer matches after re-import; it is not used until a reviewer confirms it.
      terminal: []
      transitions:
        - name: mark_stale
          from: [Read]
          to: Stale
          summary: Re-import found the spanned text changed; the id is kept.
        - name: confirm
          from: [Stale]
          to: Read
          summary: A reviewer confirmed it against the changed text under a Current decision.

  - name: rfcspec.catalogue.Registry
    naming:
      summary: >-
        An IANA registry read from IANA's XML, never from the RFC's IANA section; lowered to an
        enum with an open or closed policy. Its provenance is the IANA form, not a span.
    identity:
      name: registry_id
      type: rfcspec.catalogue.RegistryId
    fields:
      - name: entries
        type: List<rfcspec.catalogue.RegistryEntry>
      - name: policy
        type: rfcspec.catalogue.RegistryPolicy
      - name: source
        type: rfcspec.catalogue.IanaSource
    lifecycle:
      initial: Read
      states: [Read]
      terminal: [Read]

  - name: rfcspec.catalogue.Limit
    naming:
      summary: >-
        A quantity the RFC leaves to the implementation, with any stated minimum or maximum and
        the reaction the RFC states for exceeding it.
    identity:
      name: limit_id
      type: rfcspec.catalogue.ItemId
    fields:
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: name
        type: String
      - name: minimum
        type: Optional<Integer>
      - name: maximum
        type: Optional<Integer>
      - name: reaction
        type: Optional<String>
        summary: >-
          The RFC's stated reaction to a value past the limit, verbatim, such as failing the
          connection; the limit's span cites it. Absent where the RFC states none.
      - name: span
        type: rfcspec.catalogue.Span
    invariants:
      - any: [not defined(minimum), not defined(maximum), minimum <= maximum]
    lifecycle:
      initial: Read
      states:
        - name: Read
          wire: read
          summary: Read from the locked source; its span matches the spanned text.
        - name: Stale
          wire: stale
          summary: Its span no longer matches after re-import; it is not used until a reviewer confirms it.
      terminal: []
      transitions:
        - name: mark_stale
          from: [Read]
          to: Stale
          summary: Re-import found the spanned text changed; the id is kept.
        - name: confirm
          from: [Stale]
          to: Read
          summary: A reviewer confirmed it against the changed text under a Current decision.

actors:
  - name: rfcspec.catalogue.Reader
    naming:
      display: Reader
      summary: The deterministic stages S1 read and S2 extract, over locked sources only, including re-import.
    may:
      - rfcspec.catalogue.ReadRfc
      - rfcspec.catalogue.ReadSection
      - rfcspec.catalogue.ExtractRequirement
      - rfcspec.catalogue.ExtractDefinedTerm
      - rfcspec.catalogue.ExtractGrammar
      - rfcspec.catalogue.ExtractLayout
      - rfcspec.catalogue.ReadRegistry
      - rfcspec.catalogue.ExtractLimit
      - rfcspec.catalogue.MarkRequirementStale
      - rfcspec.catalogue.MarkSectionStale
      - rfcspec.catalogue.MarkDefinedTermStale
      - rfcspec.catalogue.MarkGrammarStale
      - rfcspec.catalogue.MarkLayoutStale
      - rfcspec.catalogue.MarkLimitStale
      - rfcspec.review.MarkDecisionStale

errors:
  - name: rfcspec.catalogue.RequirementStateConflict
    summary: The requirement is not in a review state this command acts from, so nothing moved.
    fields:
      - name: state
        type: rfcspec.catalogue.Requirement.State

  - name: rfcspec.catalogue.RequirementNotFound
    summary: No requirement has this id.
    fields:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.catalogue.RfcNotFound
    summary: No RFC has this number.
    fields:
      - name: number
        type: rfcspec.catalogue.RfcNumber

  - name: rfcspec.catalogue.ItemNotFound
    summary: No catalogue item of the command's kind has this id.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.catalogue.ItemNotStale
    summary: The item is current, so there is nothing to confirm and nothing moved.
    fields:
      - name: item
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.catalogue.AlreadyExists
    summary: An item with this identity is already in the catalogue, and nothing was recorded.
    fields: []

  - name: rfcspec.catalogue.ProseNotExtracted
    summary: A prose requirement enters the catalogue only through a proposal and a review decision.
    fields:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.catalogue.LevelNotSettable
    summary: The requirement's level was read from a BCP 14 source and is not set by review.
    fields:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId

  - name: rfcspec.catalogue.LimitBoundsInverted
    summary: The limit's minimum exceeds its maximum.
    fields:
      - name: limit_id
        type: rfcspec.catalogue.ItemId

commands:
  - name: rfcspec.catalogue.ReadRfc
    naming:
      wire: read-rfc
      display: Read an RFC
      summary: S1 records an RFC's index entry and the locked source it was read from.
    input:
      - name: number
        type: rfcspec.catalogue.RfcNumber
      - name: title
        type: String
      - name: status
        type: String
      - name: stream
        type: String
      - name: area
        type: Optional<String>
      - name: date
        type: rfcspec.catalogue.YearMonth
        example: "2011-12"
      - name: format_read
        type: rfcspec.catalogue.SourceFormat
      - name: digest
        type: rfcspec.catalogue.Digest
      - name: obsoletes
        type: List<Integer>
      - name: obsoleted_by
        type: List<Integer>
      - name: updates
        type: List<Integer>
      - name: updated_by
        type: List<Integer>
    outcomes:
      - name: read
        creates: rfcspec.catalogue.Rfc
        instance: number
        emits:
          - rfcspec.catalogue.RfcRead
        payload:
          rfcspec.catalogue.RfcRead:
            number: input.number
            digest: input.digest
        sets:
          title: input.title
          status: input.status
          stream: input.stream
          area: input.area
          date: input.date
          format_read: input.format_read
          digest: input.digest
          obsoletes: input.obsoletes
          obsoleted_by: input.obsoleted_by
          updates: input.updates
          updated_by: input.updated_by
        summary: The RFC is in the catalogue, unclassified.
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: The RFC is already in the catalogue, and nothing was recorded.

  - name: rfcspec.catalogue.ClassifyRfc
    naming:
      wire: classify-rfc
      display: Classify an RFC
      summary: A reviewer sets the RFC's primary kind under a Current decision (design sections 2.3 and 9).
    input:
      - name: number
        type: rfcspec.catalogue.RfcNumber
      - name: kind
        type: rfcspec.catalogue.RfcKind
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the RFC is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the RFC is unchanged.
      - name: classified
        updates: rfcspec.catalogue.Rfc
        instance: number
        emits:
          - rfcspec.catalogue.RfcClassified
        payload:
          rfcspec.catalogue.RfcClassified:
            number: input.number
            kind: input.kind
        sets:
          kind: input.kind
        summary: The RFC carries the kind.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.RfcNotFound
        payload:
          rfcspec.catalogue.RfcNotFound:
            number: input.number
        summary: No RFC has this number.

  - name: rfcspec.catalogue.ReadSection
    naming:
      wire: read-section
      display: Read a section
    input:
      - name: section_id
        type: rfcspec.catalogue.ItemId
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: anchor
        type: String
      - name: title
        type: String
      - name: parent
        type: Optional<rfcspec.catalogue.ItemId>
      - name: span
        type: rfcspec.catalogue.Span
    outcomes:
      - name: read
        creates: rfcspec.catalogue.Section
        instance: section_id
        emits:
          - rfcspec.catalogue.SectionRead
        payload:
          rfcspec.catalogue.SectionRead:
            section_id: input.section_id
        sets:
          rfc: input.rfc
          anchor: input.anchor
          title: input.title
          parent: input.parent
          span: input.span
        summary: The section is in the catalogue under its RFC.
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: >-
          The section is already in the catalogue, and nothing was recorded. Re-import skips a
          section whose digest is unchanged before it calls.

  - name: rfcspec.catalogue.MarkSectionStale
    naming:
      wire: mark-section-stale
      display: Mark a section stale
      summary: Re-import found that the section's span no longer matches; the section keeps its id and records the new span.
    input:
      - name: section_id
        type: rfcspec.catalogue.ItemId
      - name: span
        type: rfcspec.catalogue.Span
    outcomes:
      - name: stale
        moves: rfcspec.catalogue.Section.mark_stale
        instance: section_id
        emits:
          - rfcspec.catalogue.SectionStale
        payload:
          rfcspec.catalogue.SectionStale:
            section_id: input.section_id
        sets:
          span: input.span
        summary: The section is Stale until a reviewer confirms it.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.section_id
        summary: No section has this id.
      - name: already-stale
        wrong_state: true
        refuses: false
        summary: A stale section stays stale.

  - name: rfcspec.catalogue.ConfirmSection
    naming:
      wire: confirm-section
      display: Confirm a stale section
      summary: A reviewer confirms a stale section against its changed text under a Current decision on that text.
    input:
      - name: section_id
        type: rfcspec.catalogue.ItemId
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision judged another text than the section's span, and the section is unchanged.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the section is unchanged.
      - name: other-item
        when_related: {via: input.decision, predicate: item != input.section_id}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item, and the section is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the section is unchanged.
      - name: confirmed
        moves: rfcspec.catalogue.Section.confirm
        instance: section_id
        emits:
          - rfcspec.catalogue.SectionConfirmed
        payload:
          rfcspec.catalogue.SectionConfirmed:
            section_id: input.section_id
        summary: The section is current again.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.section_id
        summary: No section has this id.
      - name: wrong-state
        wrong_state: true
        error: rfcspec.catalogue.ItemNotStale
        payload:
          rfcspec.catalogue.ItemNotStale:
            item: input.section_id
        summary: Only a stale section is confirmed.

  - name: rfcspec.catalogue.ExtractRequirement
    naming:
      wire: extract-requirement
      display: Extract a requirement
      summary: >-
        S2 records a requirement found mechanically in XML, plain text or an ABNF comment. A prose
        requirement enters only through a proposal and a review decision.
    input:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: section_id
        type: rfcspec.catalogue.ItemId
      - name: ordinal
        type: Integer
      - name: level
        type: rfcspec.catalogue.Bcp14Level
      - name: text
        type: String
      - name: span
        type: rfcspec.catalogue.Span
      - name: source
        type: rfcspec.catalogue.RequirementSource
    outcomes:
      - name: prose
        when: source == Prose
        error: rfcspec.catalogue.ProseNotExtracted
        payload:
          rfcspec.catalogue.ProseNotExtracted:
            requirement_id: input.requirement_id
        summary: A prose requirement is not extracted mechanically, and nothing was recorded.
      - name: extracted
        creates: rfcspec.catalogue.Requirement
        instance: requirement_id
        emits:
          - rfcspec.catalogue.RequirementExtracted
        payload:
          rfcspec.catalogue.RequirementExtracted:
            requirement_id: input.requirement_id
        sets:
          rfc: input.rfc
          section_id: input.section_id
          ordinal: input.ordinal
          level: input.level
          text: input.text
          span: input.span
          source: input.source
        summary: The requirement is in the catalogue, Extracted, with its level and no party.
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: >-
          The requirement is already in the catalogue, and nothing was recorded. Re-import skips a
          requirement whose digest is unchanged before it calls.

  - name: rfcspec.catalogue.ProposeRequirement
    naming:
      wire: propose-requirement
      display: Record a requirement from prose
      summary: >-
        A reviewer records a requirement S3 proposed from the prose of an RFC before BCP 14, under
        a Current accept or edit decision on its text.
    input:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: section_id
        type: rfcspec.catalogue.ItemId
      - name: ordinal
        type: Integer
      - name: text
        type: String
      - name: span
        type: rfcspec.catalogue.Span
      - name: party
        type: Optional<rfcspec.catalogue.PartyName>
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: >-
          The requirement is already in the catalogue, and nothing was recorded. Re-import skips a
          requirement whose digest is unchanged before it calls.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and nothing was recorded.
      - name: other-item
        when_related:
          via: input.decision
          predicate:
            any:
              - item != input.requirement_id
              - text_digest != input.span.digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item or text, and nothing was recorded.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and nothing was recorded.
      - name: kind-mismatch
        when_related:
          via: input.decision
          predicate:
            all: [kind != Accept, kind != Edit]
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: Only an accept or edit decision records a requirement from prose.
      - name: proposed
        creates: rfcspec.catalogue.Requirement
        into: Accepted
        instance: requirement_id
        emits:
          - rfcspec.catalogue.RequirementProposed
        payload:
          rfcspec.catalogue.RequirementProposed:
            requirement_id: input.requirement_id
        sets:
          rfc: input.rfc
          section_id: input.section_id
          ordinal: input.ordinal
          text: input.text
          span: input.span
          source: Prose
          party: input.party
        summary: >-
          The requirement is in the catalogue, Accepted under the decision, with source prose, the
          party the decision gives and no level until a reviewer sets it.

  - name: rfcspec.catalogue.AcceptRequirement
    naming:
      wire: accept-requirement
      display: Accept a requirement
      summary: >-
        A review decision accepts the requirement, possibly edited. A stale requirement is
        accepted only under a Current decision on its changed text, which ConfirmDecision records.
    input:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
      - name: party
        type: Optional<rfcspec.catalogue.PartyName>
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision judged another text than the requirement's span, and the requirement is unchanged.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the requirement is unchanged.
      - name: other-item
        when_related: {via: input.decision, predicate: item != input.requirement_id}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item, and the requirement is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the requirement is unchanged.
      - name: kind-mismatch
        when_related:
          via: input.decision
          predicate:
            all: [kind != Accept, kind != Edit]
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: Only an accept or edit decision accepts a requirement, and the requirement is unchanged.
      - name: accepted
        moves: rfcspec.catalogue.Requirement.accept
        instance: requirement_id
        emits:
          - rfcspec.catalogue.RequirementAccepted
        payload:
          rfcspec.catalogue.RequirementAccepted:
            requirement_id: input.requirement_id
        sets:
          party: input.party
        summary: The requirement is Accepted with the party the decision gives.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.RequirementNotFound
        summary: No requirement has this id.
      - name: wrong-state
        wrong_state: true
        error: rfcspec.catalogue.RequirementStateConflict
        summary: The requirement is already Accepted or Rejected.

  - name: rfcspec.catalogue.SetRequirementLevel
    naming:
      wire: set-requirement-level
      display: Set a requirement's level
      summary: >-
        A reviewer sets the BCP 14 level of a requirement proposed from prose, under a Current
        decision on its text; a lower-case should is proposed as SHOULD. A level read from a BCP 14
        source is never overwritten.
    input:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
      - name: level
        type: rfcspec.catalogue.Bcp14Level
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: not-prose
        when_subject:
          predicate: source != Prose
        error: rfcspec.catalogue.LevelNotSettable
        payload:
          rfcspec.catalogue.LevelNotSettable:
            requirement_id: input.requirement_id
        summary: The level was read from a BCP 14 source, and it stays.
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision judged another text than the requirement's span, and the requirement is unchanged.
      - name: wrong-state
        when_subject:
          predicate:
            any: [state == Rejected, state == Stale]
        error: rfcspec.catalogue.RequirementStateConflict
        payload:
          rfcspec.catalogue.RequirementStateConflict:
            state: {subject: state}
        summary: A Rejected or Stale requirement takes no level.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the requirement is unchanged.
      - name: other-item
        when_related: {via: input.decision, predicate: item != input.requirement_id}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item, and the requirement is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the requirement is unchanged.
      - name: set
        updates: rfcspec.catalogue.Requirement
        instance: requirement_id
        emits:
          - rfcspec.catalogue.RequirementLevelSet
        payload:
          rfcspec.catalogue.RequirementLevelSet:
            requirement_id: input.requirement_id
            level: input.level
        sets:
          level: input.level
        summary: The requirement carries the level.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.RequirementNotFound
        summary: No requirement has this id.

  - name: rfcspec.catalogue.RejectRequirement
    naming:
      wire: reject-requirement
      display: Reject a requirement
      summary: >-
        A review decision rejects the requirement. A stale requirement is rejected only under a
        Current decision on its changed text, which ConfirmDecision records.
    input:
      - name: requirement_id
        type: rfcspec.catalogue.ItemId
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
