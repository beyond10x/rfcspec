          - rfcspec.catalogue.LayoutStale
        payload:
          rfcspec.catalogue.LayoutStale:
            layout_id: input.layout_id
        sets:
          span: input.span
        summary: The layout is Stale until a reviewer confirms it.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.layout_id
        summary: No layout has this id.
      - name: already-stale
        wrong_state: true
        refuses: false
        summary: A stale layout stays stale.

  - name: rfcspec.catalogue.ConfirmLayout
    naming:
      wire: confirm-layout
      display: Confirm a stale layout
      summary: A reviewer confirms a stale layout against its changed text under a Current decision on that text.
    input:
      - name: layout_id
        type: rfcspec.catalogue.ItemId
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision judged another text than the layout's span, and the layout is unchanged.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the layout is unchanged.
      - name: other-item
        when_related: {via: input.decision, predicate: item != input.layout_id}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item, and the layout is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the layout is unchanged.
      - name: confirmed
        moves: rfcspec.catalogue.Layout.confirm
        instance: layout_id
        emits:
          - rfcspec.catalogue.LayoutConfirmed
        payload:
          rfcspec.catalogue.LayoutConfirmed:
            layout_id: input.layout_id
        summary: The layout is current again.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.layout_id
        summary: No layout has this id.
      - name: wrong-state
        wrong_state: true
        error: rfcspec.catalogue.ItemNotStale
        payload:
          rfcspec.catalogue.ItemNotStale:
            item: input.layout_id
        summary: Only a stale layout is confirmed.

  - name: rfcspec.catalogue.ReadRegistry
    naming:
      wire: read-registry
      display: Read a registry
      summary: A registry is read from IANA's XML, never from an RFC's IANA section.
    input:
      - name: registry_id
        type: rfcspec.catalogue.RegistryId
      - name: entries
        type: List<rfcspec.catalogue.RegistryEntry>
      - name: policy
        type: rfcspec.catalogue.RegistryPolicy
      - name: source
        type: rfcspec.catalogue.IanaSource
    outcomes:
      - name: read
        creates: rfcspec.catalogue.Registry
        instance: registry_id
        emits:
          - rfcspec.catalogue.RegistryRead
        payload:
          rfcspec.catalogue.RegistryRead:
            registry_id: input.registry_id
        sets:
          entries: input.entries
          policy: input.policy
          source: input.source
        summary: The registry is in the catalogue with its IANA source.
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: The registry is already in the catalogue, and nothing was recorded.

  - name: rfcspec.catalogue.ExtractLimit
    naming:
      wire: extract-limit
      display: Extract a limit
    input:
      - name: limit_id
        type: rfcspec.catalogue.ItemId
      - name: rfc
        type: rfcspec.catalogue.RfcNumber
      - name: name
        type: String
      - name: minimum
        type: Optional<Integer>
      - name: maximum
        type: Optional<Integer>
      - name: reaction
        type: Optional<String>
      - name: span
        type: rfcspec.catalogue.Span
    outcomes:
      - name: bounds-inverted
        when:
          all: [defined(minimum), defined(maximum), "coalesce(minimum, 0) > coalesce(maximum, 0)"]
        error: rfcspec.catalogue.LimitBoundsInverted
        payload:
          rfcspec.catalogue.LimitBoundsInverted:
            limit_id: input.limit_id
        summary: The minimum exceeds the maximum, and nothing was recorded.
      - name: extracted
        creates: rfcspec.catalogue.Limit
        instance: limit_id
        emits:
          - rfcspec.catalogue.LimitExtracted
        payload:
          rfcspec.catalogue.LimitExtracted:
            limit_id: input.limit_id
        sets:
          rfc: input.rfc
          name: input.name
          minimum: input.minimum
          maximum: input.maximum
          reaction: input.reaction
          span: input.span
        summary: The limit is in the catalogue.
      - name: already-exists
        existing_instance: true
        error: rfcspec.catalogue.AlreadyExists
        summary: >-
          The limit is already in the catalogue, and nothing was recorded. Re-import skips a limit
          whose digest is unchanged before it calls.

  - name: rfcspec.catalogue.MarkLimitStale
    naming:
      wire: mark-limit-stale
      display: Mark a limit stale
      summary: Re-import found that the limit's span no longer matches; the limit keeps its id and records the new span.
    input:
