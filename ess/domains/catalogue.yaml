          span: input.span
        summary: The limit is Stale until a reviewer confirms it.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.limit_id
        summary: No limit has this id.
      - name: already-stale
        wrong_state: true
        refuses: false
        summary: A stale limit stays stale.

  - name: rfcspec.catalogue.ConfirmLimit
    naming:
      wire: confirm-limit
      display: Confirm a stale limit
      summary: A reviewer confirms a stale limit against its changed text under a Current decision on that text.
    input:
      - name: limit_id
        type: rfcspec.catalogue.ItemId
      - name: decision
        type: rfcspec.review.DecisionKey
    outcomes:
      - name: other-text
        when_subject:
          predicate: span.digest != input.decision.text_digest
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision judged another text than the limit's span, and the limit is unchanged.
      - name: no-decision
        when_related: {via: input.decision, exists: false}
        error: rfcspec.review.DecisionNotFound
        payload:
          rfcspec.review.DecisionNotFound:
            item: input.decision.item
        summary: No decision has the key, and the limit is unchanged.
      - name: other-item
        when_related: {via: input.decision, predicate: item != input.limit_id}
        error: rfcspec.review.DecisionMismatch
        payload:
          rfcspec.review.DecisionMismatch:
            item: input.decision.item
        summary: The decision is about another item, and the limit is unchanged.
      - name: decision-not-current
        when_related: {via: input.decision, predicate: state != Current}
        error: rfcspec.review.DecisionNotCurrent
        payload:
          rfcspec.review.DecisionNotCurrent:
            item: input.decision.item
        summary: The decision is Stale, and the limit is unchanged.
      - name: confirmed
        moves: rfcspec.catalogue.Limit.confirm
        instance: limit_id
        emits:
          - rfcspec.catalogue.LimitConfirmed
        payload:
          rfcspec.catalogue.LimitConfirmed:
            limit_id: input.limit_id
        summary: The limit is current again.
      - name: unknown
        unknown_instance: true
        error: rfcspec.catalogue.ItemNotFound
        payload:
          rfcspec.catalogue.ItemNotFound:
            item: input.limit_id
        summary: No limit has this id.
      - name: wrong-state
        wrong_state: true
        error: rfcspec.catalogue.ItemNotStale
        payload:
          rfcspec.catalogue.ItemNotStale:
            item: input.limit_id
        summary: Only a stale limit is confirmed.

