[workspace]
resolver = "3"
members = ["crates/*", "profiles/dns/generated/rust", "profiles/ntp/generated/rust", "profiles/time/generated/rust", "profiles/websocket/generated/rust"]
exclude = ["generated"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/beyond10x/rfcspec"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
