[package]
name = "rfcspec-cli"
description = "The rfcspec command line: fetch, read, extract, check, lower, generate and verify."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rfcspec"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rfcspec-conformance = { path = "../rfcspec-conformance" }
rfcspec-doc = { path = "../rfcspec-doc" }
rfcspec-ess = { path = "../rfcspec-ess" }
rfcspec-extract = { path = "../rfcspec-extract" }
rfcspec-gen = { path = "../rfcspec-gen" }
rfcspec-model = { path = "../rfcspec-model" }
rfcspec-source = { path = "../rfcspec-source" }

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true
