[package]
name = "rfcspec-docs"
description = "Generates the derived pages of the RFCspec documentation site (design, status, protocol catalogue) and checks them for drift."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rfcspec-doc = { path = "../rfcspec-doc" }
rfcspec-explorer-types = { path = "../../generated/rust/rfcspec-explorer-types", default-features = false }
rfcspec-explorer-profile-types = { path = "../../generated/rust/rfcspec-explorer-profile-types", default-features = false }
rfcspec-extract = { path = "../rfcspec-extract" }
rfcspec-model = { path = "../rfcspec-model" }
rfcspec-source = { path = "../rfcspec-source" }
serde = "1"
serde_json = "1"

[dev-dependencies]
rfcspec-propose = { path = "../rfcspec-propose", features = ["double"] }

[lints]
workspace = true
