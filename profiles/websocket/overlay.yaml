format: rfcspec-overlay/1
rfc: 6455
kind: K1
requirements:
  - id: R2-1
    source: capitals-text
    level: MUST
    transports: []
    quote: Requirements phrased in the imperative as part of algorithms (such as "strip any leading space characters" or "return false and abort these steps") are to be interpreted with the meaning of the key word ("MUST", "SHOULD", "MAY", etc.) used in introducing the algorithm.
    span:
      start: 662
      end: 665
    status:
      not-applicable: a reading convention for the RFC's algorithms, not a behaviour an endpoint performs
  - id: R3-2
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: Fragment identifiers are meaningless in the context of WebSocket URIs and MUST NOT be used on these URIs.
    span:
      start: 766
      end: 767
    status:
      unsupported: The protocol profile does not enforce the prohibition against fragment identifiers in WebSocket URIs.
  - id: R4.1-2
    source: capitals-text
    level: MUST
    transports: []
    quote: When the client is to _Establish a WebSocket Connection_ given a set of (/host/, /port/, /resource name/, and /secure/ flag), along with a list of /protocols/ and /extensions/ to be used, and an /origin/ in the case of web browsers, it MUST open a connection, send an opening handshake, and read the server's handshake in response.
    span:
      start: 797
      end: 801
    status:
      unsupported: The protocol profile's model does not implement the required handshake procedure for establishing WebSocket connections.
  - id: R4.1-3
    source: capitals-text
    level: MUST
    transports: []
    quote: The components of the WebSocket URI passed into this algorithm (/host/, /port/, /resource name/, and /secure/ flag) MUST be valid according to the specification of WebSocket URIs specified in Section 3.
    span:
      start: 808
      end: 811
    status:
      unsupported: The protocol profile's model does not implement validation of WebSocket URI components as required.
  - id: R4.1-4
    source: capitals-text
    level: MUST
    transports: []
    quote: If any of the components are invalid, the client MUST _Fail the WebSocket Connection_ and abort these steps.
    span:
      start: 811
      end: 812
    status:
      unsupported: The protocol profile's model does not implement failure handling for invalid WebSocket URI components as required.
  - id: R4.1-5
    source: capitals-text
    level: MUST
    transports: []
    quote: If the client already has a WebSocket connection to the remote host (IP address) identified by /host/ and port /port/ pair, even if the remote host is known by another name, the client MUST wait until that connection has been established or for that connection to have failed.
    span:
      start: 814
      end: 818
    status:
      unsupported: The model does not implement the requirement to wait for an existing connection to be established or fail.
  - id: R4.1-6
    source: capitals-text
    level: MUST
    transports: []
    quote: There MUST be no more than one connection in a CONNECTING state.
    span:
      start: 818
      end: 819
    status:
      unsupported: The protocol profile's model does not enforce the restriction on having only one connection in the CONNECTING state at any given time.
  - id: R4.1-7
    source: capitals-text
    level: MUST
    transports: []
    quote: If multiple connections to the same IP address are attempted simultaneously, the client MUST serialize them so that there is no more than one connection at a time running through the following steps.
    span:
      start: 819
      end: 822
    status:
      unsupported: the protocol profile's model does not handle multiple connections to the same IP address
  - id: R4.1-8
    source: capitals-text
    level: MUST
    transports: []
    quote: If the client cannot determine the IP address of the remote host (for example, because all communication is being done through a proxy server that performs DNS queries itself), then the client MUST assume for the purposes of this step that each host name refers to a distinct remote host, and instead the client SHOULD limit the total number of simultaneous pending connections to a reasonably low number (e.g., the client might allow simultaneous pending connections to a.example.com and b.example.com, but if thirty simultaneous connections to a single host are requested, that may not be allowed).
    span:
      start: 824
      end: 833
    status:
      unsupported: The model does not implement logic to handle scenarios where the client cannot determine the remote host's IP address, violating the MUST requirement.
  - id: R4.1-10
    source: capitals-text
    level: SHOULD
    transports: []
    quote: If the client is not configured to use a proxy, then a direct TCP connection SHOULD be opened to the host given by /host/ and the port given by /port/
    span:
      start: 880
      end: 882
    status:
      unsupported: Model does not support direct TCP connection establishment.
  - id: R4.1-11
    source: capitals-text
    level: MUST
    transports: []
    quote: For the purpose of proxy autoconfiguration scripts, the URI to pass the function MUST be constructed from /host/, /port/, /resource name/, and the /secure/ flag using the definition of a WebSocket URI as given in Section 3.
    span:
      start: 891
      end: 894
    status:
      unsupported: The protocol profile's model does not implement the construction of WebSocket URIs for proxy autoconfiguration scripts as required.
  - id: R4.1-12
    source: capitals-text
    level: MUST
    transports: []
    quote: If the connection could not be opened, either because a direct connection failed or because any proxy used returned an error, then the client MUST _Fail the WebSocket Connection_ and abort the connection attempt.
    span:
      start: 907
      end: 910
    status:
      unsupported: the protocol profile's model does not implement failing the WebSocket connection as specified
  - id: R4.1-13
    source: capitals-text
    level: MUST
    transports: []
    quote: If /secure/ is true, the client MUST perform a TLS handshake over the connection after opening the connection and before sending the handshake data [RFC2818].
    span:
      start: 912
      end: 914
    status:
      unsupported: The protocol profile does not implement TLS handshake functionality as required.
  - id: R4.1-14
    source: capitals-text
    level: MUST
    transports: []
    quote: If this fails (e.g., the server's certificate could not be verified), then the client MUST _Fail the WebSocket Connection_ and abort the connection.
    span:
      start: 914
      end: 916
    status:
      unsupported: The protocol profile's model does not implement failure handling for TLS handshake failures in WebSocket connections.
  - id: R4.1-15
    source: capitals-text
    level: MUST
    transports: []
    quote: Otherwise, all further communication on this channel MUST run through the encrypted tunnel [RFC5246].
    span:
      start: 916
      end: 918
    status:
      unsupported: Model does not implement encrypted tunnel communication as required
  - id: R4.1-16
    source: capitals-text
    level: MUST
    transports: []
    quote: Clients MUST use the Server Name Indication extension in the TLS handshake [RFC6066].
    span:
      start: 920
      end: 921
    status:
      unsupported: the protocol profile's model does not support the Server Name Indication extension
  - id: R4.1-17
    source: capitals-text
    level: MUST
    transports: []
    quote: Once a connection to the server has been established (including a connection via a proxy or over a TLS-encrypted tunnel), the client MUST send an opening handshake to the server.
    span:
      start: 923
      end: 925
    status:
      unsupported: the profile does not model the opening handshake (section 4); the requirement applies to every client
  - id: R4.1-18
    source: capitals-text
    level: MUST
    transports: []
    quote: The handshake MUST be a valid HTTP request as specified by [RFC2616].
    span:
      start: 930
      end: 931
    status:
      unsupported: the protocol profile does not implement HTTP handshakes
  - id: R4.1-19
    source: capitals-text
    level: MUST
    transports: []
    quote: The method of the request MUST be GET, and the HTTP version MUST be at least 1.1.
    span:
      start: 933
      end: 934
    status:
      unsupported: The protocol profile's model does not enforce the required method (GET) or HTTP version (≥1.1) constraints.
  - id: R4.1-21
    source: capitals-text
    level: MUST
    transports: []
    quote: The request MUST contain a |Host| header field whose value contains /host/ plus optionally ":" followed by /port/ (when not using the default port).
    span:
      start: 944
      end: 946
    status:
      unsupported: Model does not implement Host header validation for /host/ and /port/ as specified.
  - id: R4.1-22
    source: capitals-text
    level: MUST
    transports: []
    quote: The request MUST contain an |Upgrade| header field whose value MUST include the "websocket" keyword.
    span:
      start: 948
      end: 949
    status:
      unsupported: The model does not support the required header field
  - id: R4.1-23
    source: capitals-text
    level: MUST
    transports: []
    quote: The request MUST contain a |Connection| header field whose value MUST include the "Upgrade" token.
    span:
      start: 959
      end: 960
    status:
      unsupported: the model does not include the required |Connection| header field
  - id: R4.1-24
    source: capitals-text
    level: MUST
    transports: []
    quote: The request MUST include a header field with the name |Sec-WebSocket-Key|.
    span:
      start: 962
      end: 963
    status:
      unsupported: The model does not include the required |Sec-WebSocket-Key| header field.
  - id: R4.1-25
    source: capitals-text
    level: MUST
    transports: []
    quote: The value of this header field MUST be a nonce consisting of a randomly selected 16-byte value that has been base64-encoded (see Section 4 of [RFC4648]).
    span:
      start: 963
      end: 965
    status:
      unsupported: the profile does not model the opening handshake (section 4), so no Sec-WebSocket-Key is sent or checked
  - id: R4.1-26
    source: capitals-text
    level: MUST
    transports: []
    quote: The nonce MUST be selected randomly for each connection.
    span:
      start: 965
      end: 966
    status:
      unsupported: The protocol profile's model does not implement random nonce selection per connection.
  - id: R4.1-27
    source: capitals-text
    level: MUST
    transports: []
    quote: The request MUST include a header field with the name |Origin| [RFC6454] if the request is coming from a browser client.
    span:
      start: 973
      end: 974
    status:
      unsupported: The protocol profile's model does not support including the Origin header field as required.
  - id: R4.1-29
    source: capitals-text
    level: MUST
    transports: []
    quote: The request MUST include a header field with the name |Sec-WebSocket-Version|.  The value of this header field MUST be
    span:
      start: 987
      end: 988
    status:
      unsupported: The protocol profile's model does not include the required |Sec-WebSocket-Version| header field.
  - id: R4.1-30
    source: capitals-text
    level: MUST
    transports: []
    quote: The value of this header field MUST be 13.
    span:
      start: 988
      end: 989
    status:
      unsupported: The protocol profile's model does not enforce the Sec-WebSocket-Version header to be 13.
  - id: R4.1-32
    source: capitals-text
    level: MUST
    transports: []
    quote: The elements that comprise this value MUST be non-empty strings with characters in the range U+0021 to U+007E not including separator characters as defined in [RFC2616] and MUST all be unique strings.
    span:
      start: 1001
      end: 1004
    status:
      unsupported: The protocol profile's model does not enforce uniqueness or character restrictions on subprotocol elements.
  - id: R4.1-33
    source: capitals-text
    level: MAY
    transports: []
    quote: The request MAY include a header field with the name |Sec-WebSocket-Extensions|.
    span:
      start: 1015
      end: 1016
    status:
      unsupported: the profile does not model the opening handshake (section 4) or extensions
  - id: R4.1-34
    source: capitals-text
    level: MAY
    transports: []
    quote: The request MAY include any other header fields, for example, cookies [RFC6265] and/or authentication-related header fields such as the |Authorization| header field [RFC2616], which are processed according to documents that define them.
    span:
      start: 1021
      end: 1024
    status:
      unsupported: the profile does not model the opening handshake (section 4), so no request header fields are sent
  - id: R4.1-36
    source: capitals-text
    level: MUST
    transports: []
    quote: 'The client MUST validate the server''s response as follows:'
    span:
      start: 1028
      end: 1028
    status:
      unsupported: Model does not implement client validation of server responses as required
  - id: R4.1-37
    source: capitals-text
    level: MUST
    transports: []
    quote: If the response lacks an |Upgrade| header field or the |Upgrade| header field contains a value that is not an ASCII case- insensitive match for the value "websocket", the client MUST _Fail the WebSocket Connection_.
    span:
      start: 1037
      end: 1040
    status:
      unsupported: The model does not implement the required check for the Upgrade header field.
  - id: R4.1-38
    source: capitals-text
    level: MUST
    transports: []
    quote: If the response lacks a |Connection| header field or the |Connection| header field doesn't contain a token that is an ASCII case-insensitive match for the value "Upgrade", the client MUST _Fail the WebSocket Connection_.
    span:
      start: 1042
      end: 1045
    status:
      unsupported: The protocol profile's model does not implement the required check for the |Connection| header field's "Upgrade" token.
  - id: R4.1-40
    source: capitals-text
    level: MUST
    transports: []
    quote: If the response includes a |Sec-WebSocket-Extensions| header field and this header field indicates the use of an extension that was not present in the client's handshake (the server has indicated an extension not requested by the client), the client MUST _Fail the WebSocket Connection_.
    span:
      start: 1055
      end: 1059
    status:
      unsupported: The protocol profile does not handle extensions not requested by the client.
  - id: R4.1-41
    source: capitals-text
    level: MUST
    transports: []
    quote: If the response includes a |Sec-WebSocket-Protocol| header field and this header field indicates the use of a subprotocol that was not present in the client's handshake (the server has indicated a subprotocol not requested by the client), the client MUST _Fail the WebSocket Connection_.
    span:
      start: 1071
      end: 1075
    status:
      unsupported: The model does not implement logic to check for mismatched subprotocols in the server's response or fail the connection accordingly.
  - id: R4.1-42
    source: capitals-text
    level: MUST
    transports: []
    quote: If the server's response does not conform to the requirements for the server's handshake as defined in this section and in Section 4.2.2, the client MUST _Fail the WebSocket Connection_.
    span:
      start: 1077
      end: 1079
    status:
      unsupported: The model does not include a mechanism to fail the WebSocket connection as required.
  - id: R4.2.1-2
    source: capitals-text
    level: SHOULD NOT
    transports: []
    quote: A connection attempt lacking this header field SHOULD NOT be interpreted as coming from a browser client.
    span:
      start: 1163
      end: 1165
    status:
      unsupported: the profile does not model the server's reading of the opening handshake (section 4.2.1)
  - id: R4.2.2-1
    source: capitals-text
    level: MUST
    transports: []
    quote: When a client establishes a WebSocket connection to a server, the server MUST complete the following steps to accept the connection and send the server's opening handshake.
    span:
      start: 1189
      end: 1191
    status:
      unsupported: The model does not implement the requirement to complete the server's opening handshake steps.
  - id: R4.2.2-2
    source: capitals-text
    level: MUST
    transports: []
    quote: If this fails (e.g., the client indicated a host name in the extended client hello "server_name" extension that the server does not host), then close the connection; otherwise, all further communication for the connection (including the server's handshake) MUST run through the encrypted tunnel [RFC5246].
    span:
      start: 1194
      end: 1199
    status:
      unsupported: the profile does not model TLS or the server's opening handshake (section 4.2.2)
  - id: R4.2.2-5
    source: capitals-text
    level: MUST
    transports: []
    quote: If the server does not wish to accept this connection, it MUST return an appropriate HTTP error code (e.g., 403 Forbidden) and abort the WebSocket handshake described in this section.
    span:
      start: 1218
      end: 1221
    status:
      unsupported: the model does not handle server rejection of connections
  - id: R4.2.2-6
    source: capitals-text
    level: MUST
    transports: []
    quote: If this version does not match a version understood by the server, the server MUST abort the WebSocket handshake described in this section and instead send an appropriate HTTP error code (such as 426 Upgrade Required) and a |Sec-WebSocket-Version| header field indicating the version(s) the server is capable of understanding.
    span:
      start: 1242
      end: 1248
    status:
      unsupported: The protocol profile's model does not implement the requirement to abort the handshake and return an HTTP error code when version mismatch occurs.
  - id: R4.2.2-7
    source: capitals-text
    level: MUST
    transports: []
    quote: If the requested service is not available, the server MUST send an appropriate HTTP error code (such as 404 Not Found) and abort the WebSocket handshake.
    span:
      start: 1254
      end: 1257
    status:
      unsupported: The model does not implement handling of unavailable services with HTTP error codes and handshake abortion.
  - id: R4.2.2-8
    source: capitals-text
    level: MUST
    transports: []
    quote: The value chosen MUST be derived from the client's handshake, specifically by selecting one of the values from the |Sec-WebSocket-Protocol| field that the server is willing to use for this connection (if any).
    span:
      start: 1261
      end: 1264
    status:
      unsupported: The model does not support deriving the subprotocol value from the client's handshake as specified.
  - id: R4.2.2-9
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: The absence of such a field is equivalent to the null value (meaning that if the server does not wish to agree to one of the suggested subprotocols, it MUST NOT send back a |Sec-WebSocket-Protocol| header field in its response).
    span:
      start: 1267
      end: 1271
    status:
      unsupported: the profile does not model subprotocol selection in the opening handshake (section 4.2.2)
  - id: R4.2.2-10
    source: capitals-text
    level: MUST
    transports: []
    quote: If the server supports multiple extensions, then the value MUST be derived from the client's handshake, specifically by selecting one or more of the values from the |Sec-WebSocket-Extensions| field.
    span:
      start: 1279
      end: 1282
    status:
      unsupported: the profile does not model extension negotiation in the opening handshake (section 4.2.2)
  - id: R4.2.2-11
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: Extensions not listed by the client MUST NOT be listed.
    span:
      start: 1295
      end: 1296
    status:
      unsupported: The protocol profile's model does not enforce this restriction on extensions listed by the server.
  - id: R4.2.2-12
    source: capitals-text
    level: MUST
    transports: []
    quote: If the server chooses to accept the incoming connection, it MUST reply with a valid HTTP response indicating the following.
    span:
      start: 1299
      end: 1300
    status:
      unsupported: The protocol profile's model does not implement HTTP response handling for connection acceptance.
  - id: R4.4-1
    source: capitals-text
    level: MUST
    transports: []
    quote: If the server doesn't support the requested version, it MUST respond with a |Sec-WebSocket-Version| header field (or multiple |Sec-WebSocket-Version| header fields) containing all versions it is willing to use.
    span:
      start: 1435
      end: 1439
    status:
      unsupported: The protocol profile's model does not implement the required response mechanism for unsupported versions.
  - id: R5.1-1
    source: capitals-text
    level: MUST
    transports: []
    quote: To avoid confusing network intermediaries (such as intercepting proxies) and for security reasons that are further discussed in Section 10.3, a client MUST mask all frames that it sends to the server (see Section 5.3 for further details).
    span:
      start: 1490
      end: 1493
    status:
      unsupported: The protocol profile's model does not implement frame masking as required.
  - id: R5.1-2
    source: capitals-text
    level: MUST
    transports: []
    quote: (Note that masking is done whether or not the WebSocket Protocol is running over TLS.)  The server MUST close the connection upon receiving a frame that is not masked.
    span:
      start: 1493
      end: 1496
    status:
      unsupported: The protocol profile's model does not enforce connection closure for unmasked frames received by the server.
  - id: R5.1-5
    source: capitals-text
    level: MUST
    transports: []
    quote: A client MUST close a connection if it detects a masked frame.
    span:
      start: 1499
      end: 1500
    status:
      unsupported: The model does not enforce closing the connection when a masked frame is detected.
  - id: R5.1-6
    source: capitals-text
    level: MAY
    transports: []
    quote: In this case, it MAY use the status code 1002 (protocol error) as defined in Section 7.4.1.
    span:
      start: 1500
      end: 1501
    status:
      unsupported: The model does not implement the optional use of status code 1002 as specified.
  - id: R5.1-7
    source: capitals-text
    level: MAY
    transports: []
    quote: A data frame MAY be transmitted by either the client or the server at any time after opening handshake completion and before that endpoint has sent a Close frame (Section 5.5.1).
    span:
      start: 1519
      end: 1521
    status:
      unsupported: data frames are modelled only along the one path of the fragments machine (text, start, Pong, continue, finish, close), not at any time after the opening handshake
  - id: R5.2-1
    source: capitals-text
    level: MAY
    quote: "The first fragment MAY also be the final fragment."
    span: {start: 1556, end: 1557}
    status: {satisfied: layout.frame-header}
  - id: R5.2-2
    source: capitals-text
    level: MUST
    quote: "MUST be 0 unless an extension is negotiated that defines meanings for non-zero values."
    span: {start: 1561, end: 1562}
    status: {unsupported: "the layout leaves RSV1 to RSV3 unconstrained: whether an extension is negotiated is state of the opening handshake, which this profile does not model"}
  - id: R5.2-3
    source: capitals-text
    level: MUST
    quote: "If a nonzero value is received and none of the negotiated extensions defines the meaning of such a nonzero value, the receiving endpoint MUST _Fail the WebSocket Connection_."
    span: {start: 1562, end: 1565}
    status: {unsupported: "the reserved bits are not modelled: the data frames of the fragments machine carry only opcode and fin, and whether an extension is negotiated is state of the opening handshake, which this profile does not model"}
  - id: R5.2-4
    source: capitals-text
    level: MUST
    quote: "If an unknown opcode is received, the receiving endpoint MUST _Fail the WebSocket Connection_."
    span: {start: 1577, end: 1579}
    status: {unsupported: "the opcode registry is not modelled: the fragments machine sends only opcodes 0 and 1, and no transition fails on an unknown opcode"}
  - id: R5.2-5
    source: capitals-text
    level: MUST
    quote: "If 127, the following 8 bytes interpreted as a 64-bit unsigned integer (the most significant bit MUST be 0) are the payload length."
    span: {start: 1608, end: 1610}
    status: {satisfied: layout.frame-header}
  - id: R5.2-6
    source: capitals-text
    level: MUST
    quote: "Note that in all cases, the minimal number of bytes MUST be used to encode the length, for example, the length of a 124-byte-long string can't be encoded as the sequence 126, 0, 124."
    span: {start: 1611, end: 1614}
    status: {satisfied: layout.frame-header}
  - id: R5.2-7
    source: capitals-text
    level: MUST
    quote: "Any extension MUST specify the length of the \"Extension data\", or how that length may be calculated, and how the extension use MUST be negotiated during the opening handshake."
    span: {start: 1647, end: 1649}
    status: {not-applicable: "addressed to the authors of extension specifications, not to an endpoint"}
  - id: R5.2-8
    source: abnf-comment
    level: MUST
    quote: "1 bit in length, MUST be 0 unless"
    span: {start: 1706, end: 1706}
    status: {unsupported: "the layout leaves RSV1 unconstrained: whether an extension is negotiated is state of the opening handshake, which this profile does not model"}
  - id: R5.2-9
    source: abnf-comment
    level: MUST
    quote: "1 bit in length, MUST be 0 unless"
    span: {start: 1710, end: 1710}
    status: {unsupported: "the layout leaves RSV2 unconstrained: whether an extension is negotiated is state of the opening handshake, which this profile does not model"}
  - id: R5.2-10
    source: abnf-comment
    level: MUST
    quote: "1 bit in length, MUST be 0 unless"
    span: {start: 1714, end: 1714}
    status: {unsupported: "the layout leaves RSV3 unconstrained: whether an extension is negotiated is state of the opening handshake, which this profile does not model"}
  - id: R5.3-2
    source: capitals-text
    level: MUST
    transports: []
    quote: When preparing a masked frame, the client MUST pick a fresh masking key from the set of allowed 32-bit values.
    span:
      start: 1805
      end: 1806
    status:
      unsupported: the model does not generate a fresh masking key as required
  - id: R5.3-3
    source: capitals-text
    level: MUST
    transports: []
    quote: The masking key needs to be unpredictable; thus, the masking key MUST be derived from a strong source of entropy, and the masking key for a given frame MUST NOT make it simple for a server/proxy to predict the masking key for a subsequent frame.
    span:
      start: 1806
      end: 1810
    status:
      unsupported: The protocol profile's model does not implement masking key derivation from a strong entropy source.
  - id: R5.4-1
    source: capitals-text
    level: MAY
    quote: "Control frames (see Section 5.5) MAY be injected in the middle of a fragmented message."
    span: {start: 1894, end: 1895}
    status: {satisfied: fragments.client.R5.4-1-R5.4-2-R5.5.3-2-send-pong}
  - id: R5.4-2
    source: capitals-text
    level: MUST NOT
    quote: "Control frames themselves MUST NOT be fragmented."
    span: {start: 1895, end: 1896}
    status: {satisfied: fragments.client.R5.4-1-R5.4-2-R5.5.3-2-send-pong}
  - id: R5.4-3
    source: capitals-text
    level: MUST
    quote: "Message fragments MUST be delivered to the recipient in the order sent by the sender."
    span: {start: 1898, end: 1899}
    status: {unsupported: "delivery order is the tcp layer's ordered delivery, not an element of the fragments machine"}
  - id: R5.4-4
    source: capitals-text
    level: MUST NOT
    quote: "The fragments of one message MUST NOT be interleaved between the fragments of another message unless an extension has been negotiated that can interpret the interleaving."
    span: {start: 1911, end: 1913}
    status: {satisfied: fragments.server.R5.4-4-interleaved-message}
  - id: R5.4-5
    source: capitals-text
    level: MUST
    quote: "An endpoint MUST be capable of handling control frames in the middle of a fragmented message."
    span: {start: 1915, end: 1916}
    status: {satisfied: fragments.server.R5.4-1-R5.4-5-pong-in-message}
  - id: R5.4-6
    source: capitals-text
    level: MAY
    quote: "A sender MAY create fragments of any size for non-control messages."
    span: {start: 1918, end: 1919}
    status: {unsupported: "ess-gap G3: fragment sizes are payload byte lengths; the data frames of the fragments machine carry only opcode and fin"}
  - id: R5.4-7
    source: capitals-text
    level: MUST
    quote: "Clients and servers MUST support receiving both fragmented and unfragmented messages."
    span: {start: 1921, end: 1922}
    status: {unsupported: "only the server receives data frames in the fragments machine; the client receives no message"}
  - id: R5.4-8
    source: capitals-text
    level: MUST NOT
    quote: "As control frames cannot be fragmented, an intermediary MUST NOT attempt to change the fragmentation of a control frame."
    span: {start: 1924, end: 1925}
    status: {not-applicable: "addressed to intermediaries, and the profile models two endpoints"}
  - id: R5.4-9
    source: capitals-text
    level: MUST NOT
    quote: "An intermediary MUST NOT change the fragmentation of a message if any reserved bit values are used and the meaning of these values is not known to the intermediary."
    span: {start: 1927, end: 1929}
    status: {not-applicable: "addressed to intermediaries, and the profile models two endpoints"}
  - id: R5.4-10
    source: capitals-text
    level: MUST NOT
    quote: "An intermediary MUST NOT change the fragmentation of any message in the context of a connection where extensions have been negotiated and the intermediary is not aware of the semantics of the negotiated extensions."
    span: {start: 1931, end: 1934}
    status: {not-applicable: "addressed to intermediaries, and the profile models two endpoints"}
  - id: R5.4-11
    source: capitals-text
    level: MUST NOT
    quote: "Similarly, an intermediary that didn't see the WebSocket handshake (and wasn't notified about its content) that resulted in a WebSocket connection MUST NOT change the fragmentation of any message of such connection."
    span: {start: 1934, end: 1937}
    status: {not-applicable: "addressed to intermediaries, and the profile models two endpoints"}
  - id: R5.4-12
    source: capitals-text
    level: MUST
    quote: "Since control frames cannot be fragmented, the type for all fragments in a message MUST be either text, binary, or one of the reserved opcodes."
    span: {start: 1940, end: 1943}
    status: {satisfied: fragments.server.R5.4-12-start-message}
  - id: R5.5-1
    source: capitals-text
    level: MUST
    quote: "All control frames MUST have a payload length of 125 bytes or less and MUST NOT be fragmented."
    span: {start: 1978, end: 1979}
    status: {unsupported: "ess-gap G1: a payload length class that depends on the opcode needs a guard beyond equality; that control frames are not fragmented is R5.4-2"}
  - id: R5.5.1-1
    source: capitals-text
    level: MAY
    quote: "The Close frame MAY contain a body (the \"Application data\" portion of the frame) that indicates a reason for closing, such as an endpoint shutting down, an endpoint having received a frame too large, or an endpoint having received a frame that does not conform to the format expected by the endpoint."
    span: {start: 1985, end: 1989}
    status: {unsupported: "ess-gap G3: the close reason is a byte string; the close frame carries only its status code"}
  - id: R5.5.1-2
    source: capitals-text
    level: MUST
    quote: "If there is a body, the first two bytes of the body MUST be a 2-byte unsigned integer (in network byte order) representing a status code with value /code/ defined in Section 7.4."
    span: {start: 1989, end: 1991}
    status: {unsupported: "ess-gap G8: the byte form of the close frame body belongs to the wire layer; the close frame carries its status code as an Integer"}
  - id: R5.5.1-3
    source: capitals-text
    level: MAY
    quote: "Following the 2-byte integer, the body MAY contain UTF-8-encoded data with value /reason/, the interpretation of which is not defined by this specification."
    span: {start: 1992, end: 1994}
    status: {unsupported: "ess-gap G3: the close reason is a byte string; the close frame carries only its status code"}
  - id: R5.5.1-4
    source: capitals-text
    level: MUST NOT
    quote: "As the data is not guaranteed to be human readable, clients MUST NOT show it to end users."
    span: {start: 1996, end: 1997}
    status: {not-applicable: "about what a client application shows its user, outside the protocol"}
  - id: R5.5.1-5
    source: capitals-text
    level: MUST NOT
    quote: "The application MUST NOT send any more data frames after sending a Close frame."
    span: {start: 2002, end: 2003}
    status: {satisfied: fragments.client.R5.5.1-5-R5.5.1-8-close-after-message}
  - id: R5.5.1-6
    source: capitals-text
    level: MUST
    quote: "If an endpoint receives a Close frame and did not previously send a Close frame, the endpoint MUST send a Close frame in response."
    span: {start: 2005, end: 2006}
    status: {satisfied: close.server.R5.5.1-6-R5.5.1-7-R5.5.1-9-R5.5.1-10-echo-close}
  - id: R5.5.1-7
    source: capitals-text
    level: SHOULD
    quote: "(When sending a Close frame in response, the endpoint typically echos the status code it received.)  It SHOULD do so as soon as practical."
    span: {start: 2006, end: 2008}
    status: {satisfied: close.server.R5.5.1-6-R5.5.1-7-R5.5.1-9-R5.5.1-10-echo-close}
  - id: R5.5.1-8
    source: capitals-text
    level: MAY
    quote: "An endpoint MAY delay sending a Close frame until its current message is sent (for instance, if the majority of a fragmented message is already sent, an endpoint MAY send the remaining fragments before sending a Close frame)."
    span: {start: 2008, end: 2012}
    status: {satisfied: fragments.client.R5.5.1-5-R5.5.1-8-close-after-message}
  - id: R5.5.1-9
    source: capitals-text
    level: MUST
    quote: "After both sending and receiving a Close message, an endpoint considers the WebSocket connection closed and MUST close the underlying TCP connection."
    span: {start: 2023, end: 2025}
    status: {satisfied: close.client.R5.5.1-9-R7.1.2-2-close-echoed}
  - id: R5.5.1-10
    source: capitals-text
    level: MUST
    quote: "The server MUST close the underlying TCP connection immediately; the client SHOULD wait for the server to close the connection but MAY close the connection at any time after sending and receiving a Close message, e.g., if it has not received a TCP Close from the server in a reasonable time period."
    span: {start: 2025, end: 2029}
    status: {satisfied: close.server.R5.5.1-6-R5.5.1-7-R5.5.1-9-R5.5.1-10-echo-close}
  - id: R5.5.2-1
    source: capitals-text
    level: MAY
    quote: "A Ping frame MAY include \"Application data\"."
    span: {start: 2040, end: 2040}
    status: {satisfied: ping.client.R5.5.2-1-R5.5.2-4-send-ping}
  - id: R5.5.2-2
    source: capitals-text
    level: MUST
    quote: "Upon receipt of a Ping frame, an endpoint MUST send a Pong frame in response, unless it already received a Close frame."
    span: {start: 2042, end: 2043}
    status: {satisfied: ping.server.R5.5.2-2-R5.5.2-3-pong}
  - id: R5.5.2-3
    source: capitals-text
    level: SHOULD
    quote: "It SHOULD respond with Pong frame as soon as is practical."
    span: {start: 2043, end: 2044}
    status: {satisfied: ping.server.R5.5.2-2-R5.5.2-3-pong}
  - id: R5.5.2-4
    source: capitals-text
    level: MAY
    quote: "An endpoint MAY send a Ping frame any time after the connection is established and before the connection is closed."
    span: {start: 2047, end: 2048}
    status: {satisfied: ping.client.R5.5.2-1-R5.5.2-4-send-ping}
  - id: R5.5.3-1
    source: capitals-text
    level: MAY
    quote: "If an endpoint receives a Ping frame and has not yet sent Pong frame(s) in response to previous Ping frame(s), the endpoint MAY elect to send a Pong frame for only the most recently processed Ping frame."
    span: {start: 2064, end: 2067}
    status: {unsupported: "ess-gap G10: sending a Pong for only the most recent Ping needs a guard on whether a later Ping is pending on the incoming channel"}
  - id: R5.5.3-2
    source: capitals-text
    level: MAY
    quote: "A Pong frame MAY be sent unsolicited."
    span: {start: 2079, end: 2079}
    status: {satisfied: fragments.client.R5.4-1-R5.4-2-R5.5.3-2-send-pong}
  - id: R5.6-1
    source: capitals-text
    level: MUST
    quote: "Note that a particular text frame might include a partial UTF-8 sequence; however, the whole message MUST contain valid UTF-8."
    span: {start: 2096, end: 2098}
    status: {unsupported: "ess-gap G3: UTF-8 validity is a property of the payload bytes; the data frames of the fragments machine carry only opcode and fin"}
  - id: R5.8-1
    source: capitals-text
    level: MUST
    transports: []
    quote: The endpoints of a connection MUST negotiate the use of any extensions during the opening handshake.
    span:
      start: 2154
      end: 2156
    status:
      unsupported: The protocol profile does not implement extension negotiation during the opening handshake.
  - id: R6.2-5
    source: capitals-text
    level: MAY
    transports: []
    quote: Extensions (Section 9) MAY change the semantics of how data is read, specifically including what comprises a message boundary.
    span:
      start: 2251
      end: 2252
    status:
      unsupported: the profile does not model extensions (section 9)
  - id: R6.2-6
    source: capitals-text
    level: MAY
    transports: []
    quote: Extensions, in addition to adding "Extension data" before the "Application data" in a payload, MAY also modify the "Application data" (such as by compressing it).
    span:
      start: 2253
      end: 2255
    status:
      unsupported: The protocol profile's model does not implement extension modifications to application data.
  - id: R7.1.1-1
    source: capitals-text
    level: SHOULD
    quote: "An endpoint SHOULD use a method that cleanly closes the TCP connection, as well as the TLS session, if applicable, discarding any trailing bytes that may have been received."
    span: {start: 2267, end: 2270}
    status: {unsupported: "the TCP and TLS teardown lies below the model: closing the tcp layer is one close effect"}
  - id: R7.1.1-2
    source: capitals-text
    level: MAY
    quote: "An endpoint MAY close the connection via any means available when necessary, such as when under attack."
    span: {start: 2270, end: 2271}
    status: {not-applicable: "an implementation's defence under attack, with no protocol exchange to model"}
  - id: R7.1.1-3
    source: capitals-text
    level: SHOULD
    quote: "The underlying TCP connection, in most normal cases, SHOULD be closed first by the server, so that it holds the TIME_WAIT state and not the client (as this would prevent it from re-opening the connection for 2 maximum segment lifetimes (2MSL), while there is no corresponding server impact as a TIME_WAIT connection is immediately reopened upon a new SYN with a higher seq number)."
    span: {start: 2273, end: 2278}
    status: {satisfied: close.server.R5.5.1-6-R5.5.1-7-R5.5.1-9-R5.5.1-10-echo-close}
  - id: R7.1.1-4
    source: capitals-text
    level: MAY
    quote: "In abnormal cases (such as not having received a TCP Close from the server after a reasonable amount of time) a client MAY initiate the TCP Close."
    span: {start: 2278, end: 2280}
    status: {unsupported: "ess-gap G9: a client close while the server's Close frame may still be in flight is an outstanding obligation in protospec, while TCP discards it with the connection"}
  - id: R7.1.1-5
    source: capitals-text
    level: SHOULD
    quote: "As such, when a server is instructed to _Close the WebSocket Connection_ it SHOULD initiate a TCP Close immediately, and when a client is instructed to do the same, it SHOULD wait for a TCP Close from the server."
    span: {start: 2280, end: 2283}
    status: {satisfied: close.server.R5.5.1-6-R5.5.1-7-R5.5.1-9-R5.5.1-10-echo-close}
  - id: R7.1.2-1
    source: capitals-text
    level: MUST
    quote: "To _Start the WebSocket Closing Handshake_ with a status code (Section 7.4) /code/ and an optional close reason (Section 7.1.6) /reason/, an endpoint MUST send a Close control frame, as described in Section 5.5.1, whose status code is set to /code/ and whose close reason is set to /reason/."
    span: {start: 2305, end: 2309}
    status: {satisfied: close.client.R7.1.2-1-start-closing-handshake}
  - id: R7.1.2-2
    source: capitals-text
    level: SHOULD
    quote: "Once an endpoint has both sent and received a Close control frame, that endpoint SHOULD _Close the WebSocket Connection_ as defined in Section 7.1.1."
    span: {start: 2309, end: 2311}
    status: {satisfied: close.client.R5.5.1-9-R7.1.2-2-close-echoed}
  - id: R7.1.7-1
    source: capitals-text
    level: MUST
    quote: "To do so, the client MUST _Close the WebSocket Connection_, and MAY report the problem to the user (which would be especially useful for developers) in an appropriate manner."
    span: {start: 2386, end: 2388}
    status: {unsupported: "ess-gap G9: the client close on the closing timeout is left out of the model, because protospec keeps a Close frame in flight to a closed client as an obligation, while TCP discards it with the connection"}
  - id: R7.1.7-2
    source: capitals-text
    level: MUST
    quote: "Similarly, to do so, the server MUST _Close the WebSocket Connection_, and SHOULD log the problem."
    span: {start: 2389, end: 2390}
    status: {unsupported: "the server never closes the connection on failing it: the fragments machine's server enters failed, a state its never_state property forbids, and no transition leaves it"}
  - id: R7.1.7-3
    source: capitals-text
    level: SHOULD
    quote: "If _The WebSocket Connection is Established_ prior to the point where the endpoint is required to _Fail the WebSocket Connection_, the endpoint SHOULD send a Close frame with an appropriate status code (Section 7.4) before proceeding to _Close the WebSocket Connection_."
    span: {start: 2392, end: 2395}
    status: {unsupported: "no machine sends a Close frame on failing the connection: the close machine fails only on the closing timeout, after its Close frame was sent, and the fragments machine forbids its failed state rather than modelling what follows it"}
  - id: R7.1.7-4
    source: capitals-text
    level: MAY
    quote: "An endpoint MAY omit sending a Close frame if it believes the other side is unlikely to be able to receive and process the Close frame, due to the nature of the error that led the WebSocket connection to fail in the first place."
    span: {start: 2396, end: 2399}
    status: {unsupported: "no machine sends a Close frame on failing the connection: the close machine fails only on the closing timeout, after its Close frame was sent, and the fragments machine forbids its failed state rather than modelling what follows it"}
  - id: R7.1.7-5
    source: capitals-text
    level: MUST NOT
    quote: "An endpoint MUST NOT continue to attempt to process data (including a responding Close frame) from the remote endpoint after being instructed to _Fail the WebSocket Connection_."
    span: {start: 2399, end: 2401}
    status: {satisfied: close.client.R7.1.7-5-ignore-close-after-timeout}
  - id: R7.1.7-6
    source: capitals-text
    level: SHOULD NOT
    quote: "Except as indicated above or as specified by the application layer (e.g., a script using the WebSocket API), clients SHOULD NOT close the connection."
    span: {start: 2403, end: 2405}
    status: {satisfied: close.client.R5.5.1-9-R7.1.2-2-close-echoed}
  - id: R7.2.1-1
    source: capitals-text
    level: MUST
    quote: "To do so, the client MUST _Fail the WebSocket Connection_ as defined in Section 7.1.7."
    span: {start: 2420, end: 2422}
    status: {unsupported: "the opening handshake is outside this profile's machines"}
  - id: R7.2.1-2
    source: capitals-text
    level: MUST
    quote: "If at any point the underlying transport layer connection is unexpectedly lost, the client MUST _Fail the WebSocket Connection_."
    span: {start: 2424, end: 2425}
    status: {unsupported: "transport loss is not modelled: the tcp layer is reliable and its channels never fail"}
  - id: R7.2.1-3
    source: capitals-text
    level: SHOULD NOT
    quote: "Except as indicated above or as specified by the application layer (e.g., a script using the WebSocket API), clients SHOULD NOT close the connection."
    span: {start: 2427, end: 2429}
    status: {satisfied: close.client.R5.5.1-9-R7.1.2-2-close-echoed}
  - id: R7.2.2-1
    source: capitals-text
    level: MUST
    quote: "To do so, the server MUST simply _Close the WebSocket Connection_ (Section 7.1.1)."
    span: {start: 2434, end: 2435}
    status: {unsupported: "the opening handshake is outside this profile's machines"}
  - id: R7.2.3-1
    source: capitals-text
    level: SHOULD
    quote: "To prevent this, clients SHOULD use some form of backoff when trying to reconnect after abnormal closures as described in this section."
    span: {start: 2450, end: 2451}
    status: {unsupported: "reconnecting lies outside the lifetime of one connection, which the close machine models"}
  - id: R7.2.3-2
    source: capitals-text
    level: SHOULD
    quote: "The first reconnect attempt SHOULD be delayed by a random amount of time."
    span: {start: 2453, end: 2454}
    status: {unsupported: "reconnecting lies outside the lifetime of one connection, which the close machine models"}
  - id: R7.2.3-3
    source: capitals-text
    level: MAY
    quote: "The parameters by which this random delay is chosen are left to the client to decide; a value chosen randomly between 0 and 5 seconds is a reasonable initial delay though clients MAY choose a different interval from which to select a delay length based on implementation experience and particular application."
    span: {start: 2454, end: 2458}
    status: {unsupported: "reconnecting lies outside the lifetime of one connection, which the close machine models"}
  - id: R7.2.3-4
    source: capitals-text
    level: SHOULD
    quote: "Should the first reconnect attempt fail, subsequent reconnect attempts SHOULD be delayed by increasingly longer amounts of time, using a method such as truncated binary exponential backoff."
    span: {start: 2460, end: 2462}
    status: {unsupported: "reconnecting lies outside the lifetime of one connection, which the close machine models"}
  - id: R7.3-1
    source: capitals-text
    level: MAY
    quote: "Servers MAY close the WebSocket connection whenever desired."
    span: {start: 2473, end: 2473}
    status: {unsupported: "a server-initiated close is not modelled: the close machine starts closing from the client"}
  - id: R7.3-2
    source: capitals-text
    level: SHOULD NOT
    quote: "Clients SHOULD NOT close the WebSocket connection arbitrarily."
    span: {start: 2473, end: 2474}
    status: {satisfied: close.client.R7.1.2-1-start-closing-handshake}
  - id: R7.4-1
    source: capitals-text
    level: MAY
    quote: "When closing an established connection (e.g., when sending a Close frame, after the opening handshake has completed), an endpoint MAY indicate a reason for closure."
    span: {start: 2480, end: 2482}
    status: {satisfied: close.client.R7.1.2-1-start-closing-handshake}
  - id: R7.4.1-1
    source: capitals-text
    level: MAY
    quote: "Endpoints MAY use the following pre-defined status codes when sending a Close frame."
    span: {start: 2492, end: 2493}
    status: {satisfied: close.client.R7.1.2-1-start-closing-handshake}
  - id: R7.4.1-2
    source: capitals-text
    level: MAY
    quote: "1003 indicates that an endpoint is terminating the connection because it has received a type of data it cannot accept (e.g., an endpoint that understands only text data MAY send this if it receives a binary message)."
    span: {start: 2512, end: 2515}
    status: {unsupported: "binary messages are not modelled: the fragments machine carries text messages only, so no endpoint receives a binary message"}
  - id: R7.4.1-3
    source: capitals-text
    level: MUST NOT
    quote: "1005 is a reserved value and MUST NOT be set as a status code in a Close control frame by an endpoint."
    span: {start: 2533, end: 2534}
    status: {unsupported: "ess-gap G1: excluding a reserved close code needs a guard beyond equality on the code"}
  - id: R7.4.1-4
    source: capitals-text
    level: MUST NOT
    quote: "1006 is a reserved value and MUST NOT be set as a status code in a Close control frame by an endpoint."
    span: {start: 2540, end: 2541}
    status: {unsupported: "ess-gap G1: excluding a reserved close code needs a guard beyond equality on the code"}
  - id: R7.4.1-5
    source: capitals-text
    level: SHOULD
    quote: "The list of extensions that are needed SHOULD appear in the /reason/ part of the Close frame."
    span: {start: 2572, end: 2583}
    status: {not-applicable: "no extension is negotiated in this profile, so status code 1010 is never sent"}
  - id: R7.4.1-6
    source: capitals-text
    level: MUST NOT
    quote: "1015 is a reserved value and MUST NOT be set as a status code in a Close control frame by an endpoint."
    span: {start: 2595, end: 2596}
    status: {unsupported: "ess-gap G1: excluding a reserved close code needs a guard beyond equality on the code"}
  - id: R8.1-1
    source: capitals-text
    level: MUST
    transports: []
    quote: When an endpoint is to interpret a byte stream as UTF-8 but finds that the byte stream is not, in fact, a valid UTF-8 stream, that endpoint MUST _Fail the WebSocket Connection_.
    span:
      start: 2643
      end: 2645
    status:
      unsupported: The protocol profile's model does not implement UTF-8 validation for WebSocket connections as required.
  - id: R9-1
    source: capitals-text
    level: MAY
    transports: []
    quote: WebSocket clients MAY request extensions to this specification, and WebSocket servers MAY accept some or all extensions requested by the client.
    span:
      start: 2651
      end: 2653
    status:
      unsupported: the profile does not model extensions (section 9)
  - id: R9-2
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: A server MUST NOT respond with any extension not requested by the client.
    span:
      start: 2653
      end: 2654
    status:
      unsupported: The model does not enforce the restriction on responding with unrequested extensions.
  - id: R9-3
    source: capitals-text
    level: MUST
    transports: []
    quote: If extension parameters are included in negotiations between the client and the server, those parameters MUST be chosen in accordance with the specification of the extension to which the parameters apply.
    span:
      start: 2654
      end: 2657
    status:
      unsupported: The protocol profile's model does not implement selection of extension parameters according to the specification of the applicable extension.
  - id: R9.1-1
    source: capitals-text
    level: MUST
    transports: []
    quote: If a value is received by either the client or the server during negotiation that does not conform to the ABNF below, the recipient of such malformed data MUST immediately _Fail the WebSocket Connection_.
    span:
      start: 2666
      end: 2669
    status:
      unsupported: The model does not implement immediate connection failure for malformed data.
  - id: R9.1-4
    source: capitals-text
    level: MUST
    transports: []
    quote: Any extension-token used MUST be a registered token (see Section 11.4).
    span:
      start: 2706
      end: 2707
    status:
      unsupported: The protocol profile's model does not enforce registration of extension-tokens as required.
  - id: R9.1-5
    source: capitals-text
    level: MUST
    transports: []
    quote: The parameters supplied with any given extension MUST be defined for that extension.
    span:
      start: 2707
      end: 2708
    status:
      unsupported: The model does not implement extension parameter validation.
  - id: R9.1-7
    source: capitals-text
    level: MAY
    transports: []
    quote: Any interactions between multiple extensions MAY be defined in the documents defining the extensions.
    span:
      start: 2712
      end: 2714
    status:
      unsupported: the profile does not model extensions (section 9), so no interaction between them
  - id: R9.2-1
    source: capitals-text
    level: MAY
    transports: []
    quote: This document doesn't define any extension, but implementations MAY use extensions defined separately.
    span:
      start: 2758
      end: 2759
    status:
      unsupported: the profile does not model extensions (section 9)
  - id: R10.2-2
    source: capitals-text
    level: SHOULD
    transports: []
    quote: If the origin indicated is unacceptable to the server, then it SHOULD respond to the WebSocket handshake with a reply containing HTTP 403 Forbidden status code.
    span:
      start: 2791
      end: 2793
    status:
      unsupported: The protocol profile's model does not implement origin verification or HTTP 403 response handling for WebSocket handshakes.
  - id: R10.3-1
    source: capitals-text
    level: MUST
    transports: []
    quote: Clients MUST choose a new masking key for each frame, using an algorithm that cannot be predicted by end applications that provide data.
    span:
      start: 2849
      end: 2851
    status:
      unsupported: The protocol profile's model does not implement the requirement to generate unique masking keys per frame.
  - id: R10.4-1
    source: capitals-text
    level: MUST
    transports: []
    quote: Implementations that have implementation- and/or platform-specific limitations regarding the frame size or total message size after reassembly from multiple frames MUST protect themselves against exceeding those limits.
    span:
      start: 2898
      end: 2901
    status:
      unsupported: the profile does not model limits on frame or message size
  - id: R10.6-1
    source: capitals-text
    level: MUST
    transports: []
    quote: WebSocket implementations MUST support TLS and SHOULD employ it when communicating with their peers.
    span:
      start: 2930
      end: 2932
    status:
      unsupported: The protocol profile's model does not implement TLS support as required.
  - id: R10.7-1
    source: capitals-text
    level: MUST
    transports: []
    quote: Incoming data MUST always be validated by both clients and servers.
    span:
      start: 2946
      end: 2946
    status:
      unsupported: The protocol profile's model does not implement validation of incoming data as required.
  - id: R10.7-2
    source: capitals-text
    level: MAY
    transports: []
    quote: If, at any time, an endpoint is faced with data that it does not understand or that violates some criteria by which the endpoint determines safety of input, or when the endpoint sees an opening handshake that does not correspond to the values it is expecting (e.g., incorrect path or origin in the client request), the endpoint MAY drop the TCP connection.
    span:
      start: 2947
      end: 2952
    status:
      unsupported: the profile does not model the opening handshake (section 4) or an endpoint's input-safety criteria
  - id: R10.7-4
    source: capitals-text
    level: SHOULD
    transports: []
    quote: If the invalid data is sent during the WebSocket handshake, the server SHOULD return an appropriate HTTP [RFC2616] status code.
    span:
      start: 2956
      end: 2958
    status:
      unsupported: The model does not handle returning HTTP status codes for invalid WebSocket handshake data.
  - id: R11.1.1-1
    source: capitals-text
    level: MUST
    transports: []
    quote: Characters in the host component that are excluded by the syntax defined above MUST be converted from Unicode to ASCII as specified in [RFC3987] or its replacement.
    span:
      start: 3015
      end: 3017
    status:
      unsupported: The model does not implement conversion of excluded host characters to ASCII as required.
  - id: R11.1.1-2
    source: capitals-text
    level: MUST
    transports: []
    quote: Characters in other components that are excluded by the syntax defined above MUST be converted from Unicode to ASCII by first encoding the characters as UTF-8 and then replacing the corresponding bytes using their percent-encoded form as defined in the URI [RFC3986] and Internationalized Resource Identifier (IRI) [RFC3987] specifications.
    span:
      start: 3031
      end: 3036
    status:
      unsupported: The model does not implement the required conversion from Unicode to ASCII using UTF-8 and percent-encoding.
  - id: R11.1.2-1
    source: capitals-text
    level: MUST
    transports: []
    quote: Encoding considerations Characters in the host component that are excluded by the syntax defined above MUST be converted from Unicode to ASCII as specified in [RFC3987] or its replacement.
    span:
      start: 3091
      end: 3094
    status:
      unsupported: The protocol profile's model does not implement the required conversion of excluded characters from Unicode to ASCII as specified in [RFC3987] or its replacement.
  - id: R11.1.2-2
    source: capitals-text
    level: MUST
    transports: []
    quote: Characters in other components that are excluded by the syntax defined above MUST be converted from Unicode to ASCII by first encoding the characters as UTF-8 and then replacing the corresponding bytes using their percent-encoded form as defined in the URI [RFC3986] and IRI [RFC3987] specifications.
    span:
      start: 3099
      end: 3103
    status:
      unsupported: The protocol profile's model does not implement the required Unicode-to-ASCII conversion mechanism for excluded characters.
  - id: R11.3.1-1
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: The |Sec-WebSocket-Key| header field MUST NOT appear more than once in an HTTP request.
    span:
      start: 3182
      end: 3183
    status:
      unsupported: The protocol profile's model does not enforce restrictions on header field multiplicity.
  - id: R11.3.2-2
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: However, the |Sec-WebSocket-Extensions| header field MUST NOT appear more than once in an HTTP response.
    span:
      start: 3231
      end: 3232
    status:
      unsupported: The model does not enforce the restriction on multiple occurrences in HTTP responses.
  - id: R11.3.3-1
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: The |Sec-WebSocket-Accept| header MUST NOT appear more than once in an HTTP response.
    span:
      start: 3270
      end: 3271
    status:
      unsupported: the profile does not model the opening handshake (section 4), so no Sec-WebSocket-Accept is sent or checked
  - id: R11.3.4-2
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: However, the |Sec-WebSocket-Protocol| header field MUST NOT appear more than once in an HTTP response.
    span:
      start: 3314
      end: 3315
    status:
      unsupported: The protocol profile's model does not enforce restrictions on HTTP response header field multiplicity.
  - id: R11.3.5-1
    source: capitals-text
    level: MAY
    transports: []
    quote: The |Sec-WebSocket-Version| header field MAY appear multiple times in an HTTP response (which is logically the same as a single |Sec-WebSocket-Version| header field that contains all values).
    span:
      start: 3367
      end: 3369
    status:
      unsupported: The model does not allow the Sec-WebSocket-Version header field to appear multiple times in an HTTP response.
  - id: R11.3.5-2
    source: capitals-text
    level: MUST NOT
    transports: []
    quote: However, the |Sec-WebSocket-Version| header field MUST NOT appear more than once in an HTTP request.
    span:
      start: 3370
      end: 3371
    status:
      unsupported: the profile does not model the opening handshake (section 4), so no Sec-WebSocket-Version header field is sent
layouts:
  - name: frame-header
    quote: 'Payload length:  7 bits, 7+16 bits, or 7+64 bits'
    span: {start: 1604, end: 1604}
    fields:
      - {name: fin, bits: 1, signed: false, order: big-endian}
      - {name: rsv1, bits: 1, signed: false, order: big-endian}
      - {name: rsv2, bits: 1, signed: false, order: big-endian}
      - {name: rsv3, bits: 1, signed: false, order: big-endian}
      - {name: opcode, bits: 4, signed: false, order: big-endian}
      - {name: mask, bits: 1, signed: false, order: big-endian}
      - {name: payload-len, bits: 7, signed: false, order: big-endian}
      - name: extended-payload-length-16
        bits: 16
        signed: false
        order: big-endian
        presence: {field: payload-len, equals: 126}
        constraints:
          - {range: [126, 65535]}
      - name: extended-payload-length-64
        bits: 64
        signed: false
        order: big-endian
        presence: {field: payload-len, equals: 127}
        constraints:
          - {range: [65536, 9223372036854775807]}
      - name: masking-key
        bits: 32
        signed: false
        order: big-endian
        presence: {field: mask, equals: 1}
    length: [extended-payload-length-64, extended-payload-length-16, payload-len]
machines:
  - name: close
    transport: tcp
    bounds: {max_steps: 64, max_states: 1024, max_time_ms: 30000}
    messages:
      - {name: close-frame, fields: {code: Integer, masked: Boolean}}
    participants:
      - name: client
        initial: open
        states: [open, closing, closed]
        inputs:
          - {name: close, fields: {code: Integer}}
        timers: [close-timeout]
        transitions:
          - implements: [R7.1.2-1]
            label: start-closing-handshake
            from: open
            to: closing
            on: {input: close}
            effects:
              - {send: {message: close-frame, payload: {code: {input: code}, masked: true}}}
              - {arm: {timer: close-timeout, millis: 5000}}
          - implements: [R5.5.1-9, R7.1.2-2]
            label: close-echoed
            from: closing
            to: closed
            on: {receive: close-frame}
            effects:
              - {cancel: close-timeout}
              - {emit: connection-closed}
              - {close: true}
          - implements: [R7.1.7-1]
            label: close-timeout
            from: closing
            to: closed
            on: {timer: close-timeout}
            effects:
              - {emit: connection-failed}
          - implements: [R7.1.7-5]
            label: ignore-close-after-timeout
            from: closed
            to: closed
            on: {receive: close-frame}
      - name: server
        initial: open
        states: [open, closed]
        transitions:
          - implements: [R5.5.1-6, R5.5.1-7, R5.5.1-9, R5.5.1-10]
            label: echo-close
            from: open
            to: closed
            on: {receive: close-frame}
            effects:
              - {send: {message: close-frame, payload: {code: {input: code}, masked: false}}}
              - {flush: true}
              - {close: true}
    properties:
      - {name: server-flushes-close, flush_before_close: server}
      - {name: closed-once, participant: client, event: connection-closed, max: 1}
  - name: ping
    transport: tcp
    messages:
      - {name: ping, fields: {data: Integer}}
      - {name: pong, fields: {data: Integer}}
      - {name: close-frame, fields: {code: Integer}}
    participants:
      - name: client
        initial: open
        states: [open, pinging, ponged, closing, closed]
        fields:
          - {name: ping-data, type: Integer, initial: 0}
        inputs:
          - {name: ping, fields: {data: Integer}}
          - {name: close, fields: {code: Integer}}
        transitions:
          - implements: [R5.5.2-1, R5.5.2-4]
            label: send-ping
            from: open
            to: pinging
            on: {input: ping}
            effects:
              - {set: {field: ping-data, value: {input: data}}}
              - {send: {message: ping, payload: {data: {input: data}}}}
          - implements: [R5.5.2-2]
            label: pong-echoed
            from: pinging
            to: ponged
            on: {receive: pong}
            guards:
              - {left: {input: data}, right: {local: ping-data}}
          - implements: [R7.1.2-1]
            label: start-closing-handshake
            from: open
            to: closing
            on: {input: close}
            effects:
              - {send: {message: close-frame, payload: {code: {input: code}}}}
          - implements: [R7.1.2-1]
            label: close-after-pong
            from: ponged
            to: closed
            on: {input: close}
            effects:
              - {send: {message: close-frame, payload: {code: {input: code}}}}
          - implements: [R5.5.2-1, R5.5.2-4]
            label: ping-after-close
            from: closing
            to: closed
            on: {input: ping}
            effects:
              - {send: {message: ping, payload: {data: {input: data}}}}
      - name: server
        initial: open
        states: [open, close-received]
        transitions:
          - implements: [R5.5.2-2, R5.5.2-3]
            label: pong
            from: open
            to: open
            on: {receive: ping}
            effects:
              - {send: {message: pong, payload: {data: {input: data}}}}
          - implements: [R5.5.2-2]
            label: close-received
            from: open
            to: close-received
            on: {receive: close-frame}
          - implements: [R5.5.2-2]
            label: ignore-ping-after-close
            from: close-received
            to: close-received
            on: {receive: ping}
    properties: []
  - name: fragments
    transport: tcp
    capacity: 8
    messages:
      - {name: data-frame, fields: {opcode: Integer, fin: Boolean}}
      - {name: pong, fields: {fin: Boolean}}
      - {name: close-frame, fields: {code: Integer}}
    participants:
      - name: client
        initial: open
        states: [open, texted, in-message, ponged, continued, finished, closed]
        inputs:
          - text
          - start
          - pong
          - continue
          - finish
          - {name: close, fields: {code: Integer}}
        transitions:
          - implements: [R5.2-1]
            label: send-text
            from: open
            to: texted
            on: {input: text}
            effects:
              - {send: {message: data-frame, payload: {opcode: 1, fin: true}}}
          - implements: [R5.4-12]
            label: start-message
            from: texted
            to: in-message
            on: {input: start}
            effects:
              - {send: {message: data-frame, payload: {opcode: 1, fin: false}}}
          - implements: [R5.4-1, R5.4-2, R5.5.3-2]
            label: send-pong
            from: in-message
            to: ponged
            on: {input: pong}
            effects:
              - {send: {message: pong, payload: {fin: true}}}
          - implements: [R5.4-12]
            label: continue-message
            from: ponged
            to: continued
            on: {input: continue}
            effects:
              - {send: {message: data-frame, payload: {opcode: 0, fin: false}}}
          - implements: [R5.4-12]
            label: finish-message
            from: continued
            to: finished
            on: {input: finish}
            effects:
              - {send: {message: data-frame, payload: {opcode: 0, fin: true}}}
          - implements: [R5.5.1-5, R5.5.1-8]
            label: close-after-message
            from: finished
            to: closed
            on: {input: close}
            effects:
              - {send: {message: close-frame, payload: {code: {input: code}}}}
      - name: server
        initial: idle
        states: [idle, in-message, failed, closed]
        transitions:
          - implements: [R5.2-1]
            label: text-message
            from: idle
            to: idle
            on: {receive: data-frame}
            guards:
              - {left: {input: opcode}, right: 1}
              - {left: {input: fin}, right: true}
            effects:
              - {emit: message-received}
          - implements: [R5.4-12]
            label: start-message
            from: idle
            to: in-message
            on: {receive: data-frame}
            guards:
              - {left: {input: opcode}, right: 1}
              - {left: {input: fin}, right: false}
          - implements: [R5.4-12]
            label: continue-message
            from: in-message
            to: in-message
            on: {receive: data-frame}
            guards:
              - {left: {input: opcode}, right: 0}
              - {left: {input: fin}, right: false}
          - implements: [R5.4-12]
            label: finish-message
            from: in-message
            to: idle
            on: {receive: data-frame}
            guards:
              - {left: {input: opcode}, right: 0}
              - {left: {input: fin}, right: true}
            effects:
              - {emit: message-received}
          - implements: [R5.4-4]
            label: interleaved-message
            from: in-message
            to: failed
            on: {receive: data-frame}
            guards:
              - {left: {input: opcode}, right: 1}
          - implements: [R5.5.3-2]
            label: pong
            from: idle
            to: idle
            on: {receive: pong}
            guards:
              - {left: {input: fin}, right: true}
          - implements: [R5.4-1, R5.4-5]
            label: pong-in-message
            from: in-message
            to: in-message
            on: {receive: pong}
            guards:
              - {left: {input: fin}, right: true}
          - implements: [R5.4-2]
            label: fragmented-control-frame
            from: in-message
            to: failed
            on: {receive: pong}
            guards:
              - {left: {input: fin}, right: false}
          - implements: [R5.5.1-5]
            label: close-received
            from: idle
            to: closed
            on: {receive: close-frame}
    properties:
      - {name: server-never-fails, participant: server, state: failed}
